# Signatures written for one vulnerability each of software a host runs
# itself (PHP, not a package of an application). Each says what it rests
# on: the advisory; no exploit database or proof-of-concept was read.
#
# They name the CVE and no package range: the host check that finds the
# software writes the vulnerability into the surface with its CVE, which is
# what the signature is matched to. With no such entry the hits are noise,
# counted and never alerted, as for any vulnerability the host lacks.

# CVE-2024-4577. Advisory: https://github.com/php/php-src/security/advisories/GHSA-3qgc-jrrr-25jv
# and https://nvd.nist.gov/vuln/detail/CVE-2024-4577 (PHP-CGI on Windows,
# fixed in 8.1.29, 8.2.20 and 8.3.8; on the Chinese and Japanese code
# pages, Windows's "best fit" turns the soft hyphen 0xAD into "-"). A
# query string with no "=" reaches php-cgi as its command line, so one
# that starts with a soft hyphen and a one-letter option (its value may
# follow at once) is php-cgi's options sent from the URL; so is a hyphen,
# CVE-2012-1823's form, when the option letter stands alone (-s, not
# -debug). Normalized, %AD alone is not UTF-8 and reads as U+FFFD (as any
# other byte that is not UTF-8 does: a known false hit, see
# docs/attack-detection-limits.md); %C2%AD is U+00AD. The route: a .php
# file, with or without a PATH_INFO after it, the site's index page ("/":
# "/?..." is logged so; a directory's "/blog/" is cleaned to "/blog" and
# not matched), or php-cgi itself where a server maps it
# (/php-cgi/php-cgi.exe).
[[signature]]
id = "cve-2024-4577-php-cgi-options"
title = "PHP-CGI command-line options sent in the query string (CVE-2024-4577)"
class = "cmdi"
cwe = ["CWE-78"]
cves = ["CVE-2024-4577"]
advisories = ["GHSA-3qgc-jrrr-25jv"]
source = "shentu"
license = "Apache-2.0"
[[signature.route]]
path_regex = '(?:\.php(?:/.*)?|/php-cgi(?:\.exe)?|/)$'
[[signature.match]]
part = "query"
regex = '^(?:[\x{fffd}\x{ad}][a-z]|-[a-z](?:\s|$))'
