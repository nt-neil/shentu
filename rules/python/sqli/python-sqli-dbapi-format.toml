[[samples]]
kind = "vulnerable"
note = "the search term goes by keyword into a helper that builds the SQL"
code = '''
def child_nodes(parent, term=None):
    clause = ""
    if term:
        clause = "AND label ILIKE '%%%s%%'" % term.lower()
    sql = "SELECT id, label FROM node WHERE parent = %s {extra}".format(extra=clause)
    with connection.cursor() as cur:
        cur.execute(sql, [parent])
        return cur.fetchall()

def options(request):
    rows = child_nodes(request.GET["parent"], term=request.GET.get("q"))
    return JsonResponse(rows, safe=False)
'''

[[samples]]
kind = "safe"
note = "the same helper with the term bound as a parameter"
code = '''
def child_nodes(parent, term=None):
    sql = "SELECT id, label FROM node WHERE parent = %s AND label ILIKE %s"
    with connection.cursor() as cur:
        cur.execute(sql, [parent, "%" + (term or "") + "%"])
        return cur.fetchall()

def options(request):
    rows = child_nodes(request.GET["parent"], term=request.GET.get("q"))
    return JsonResponse(rows, safe=False)
'''
