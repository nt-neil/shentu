id = "python-sqli-dbapi-format"
lang = "python"
class = "sqli"
cwe = "CWE-89"
severity = "high"
title = "Request input formatted into a SQL string passed to a DB-API cursor"
frameworks = ["flask", "django"]
sources = ["request.args", "request.form", "request.values", "request.json", "request.GET", "request.POST", "request.query_params", "request.path_params", "request.form(", "request.json(", "request.body(", "request.query", "request.match_info", "request.post(", "request.text(", "request.read(", "self.get_argument(", "self.get_arguments(", "self.get_query_argument(", "self.get_body_argument(", "self.request.body", "self.request.arguments"]
sinks = [".execute(", ".executemany(", ".executescript("]
sanitizers = ["int("]
fix = "Pass values as the second argument of execute() with the driver's placeholder (%s or ?); never use f-strings, % or .format() to build SQL."
refs = ["CVE-2026-10105"]

[[args]]
arg = 1   # the SQL text; the parameters argument is safe

[[samples]]
kind = "vulnerable"
code = '''
@app.route("/users")
def users():
    name = request.args.get("name", "")
    cur = db.cursor()
    cur.execute(f"SELECT id, email FROM users WHERE name = '{name}'")
    return jsonify(cur.fetchall())
'''

[[samples]]
kind = "vulnerable"
note = "% formatting of the SQL string, not driver parameters"
code = '''
def search(request):
    q = request.GET["q"]
    with connection.cursor() as cur:
        cur.execute("SELECT * FROM shop_item WHERE title LIKE '%%%s%%'" % q)
        return JsonResponse({"rows": cur.fetchall()})
'''

[[samples]]
kind = "safe"
code = '''
@app.route("/users")
def users():
    cur = db.cursor()
    cur.execute("SELECT id, email FROM users WHERE name = %s", (request.args.get("name", ""),))
    return jsonify(cur.fetchall())
'''

[[samples]]
kind = "vulnerable"
code = '''
@app.get("/users")
async def users(request: Request):
    name = request.query_params.get("name", "")
    async with pool.acquire() as conn:
        return await conn.execute(f"DELETE FROM sessions WHERE user = '{name}'")
'''

[[samples]]
kind = "vulnerable"
code = '''
class UserHandler(tornado.web.RequestHandler):
    def get(self):
        cur = self.application.db.cursor()
        cur.execute("SELECT * FROM users WHERE name = '%s'" % self.get_argument("name"))
'''

[[samples]]
kind = "safe"
code = '''
class UserHandler(tornado.web.RequestHandler):
    def get(self):
        cur = self.application.db.cursor()
        cur.execute("SELECT * FROM users WHERE name = %s", (self.get_argument("name"),))
'''
