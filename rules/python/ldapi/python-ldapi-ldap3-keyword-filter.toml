id = "python-ldapi-ldap3-keyword-filter"
lang = "python"
class = "ldapi"
cwe = "CWE-90"
severity = "high"
tier = "info"
title = "Request value placed in an ldap3 search_filter without escaping"
frameworks = ["django", "flask"]
sources = ["request.args", "request.form", "request.values", "request.json", "request.GET", "request.POST", "request.data", "request.query_params", "request.form(", "request.json(", "self.get_argument(", "self.get_body_argument("]
sinks = [".search(", ".extend.standard.paged_search("]
sanitizers = ["escape_filter_chars(", "ldap3.utils.conv.escape_filter_chars(", "conv.escape_filter_chars(", "escape_rdn(", "int("]
fix = "Escape each value with ldap3.utils.conv.escape_filter_chars() before it goes into the filter, and check the result has the shape you expect."
refs = ["CVE-2025-12764"]

# ldap3's Connection.search(search_base, search_filter, ...) called with keywords;
# the positional form is covered by python-ldapi-filter.
[[args]]
when = ["search_filter="]

[[samples]]
kind = "vulnerable"
code = '''
@app.post("/login")
def login():
    username = request.form["username"]
    search_filter = "({0}={1})".format(app.config["LDAP_USERNAME_ATTRIBUTE"], username)
    conn.search(search_base=app.config["LDAP_BASE_DN"], search_filter=search_filter, attributes=["cn"])
    return "ok" if conn.entries else "unknown"
'''

[[samples]]
kind = "safe"
code = '''
@app.post("/login")
def login():
    username = escape_filter_chars(request.form["username"])
    search_filter = "({0}={1})".format(app.config["LDAP_USERNAME_ATTRIBUTE"], username)
    conn.search(search_base=app.config["LDAP_BASE_DN"], search_filter=search_filter, attributes=["cn"])
    return "ok" if conn.entries else "unknown"
'''

[[samples]]
kind = "safe"
note = "a regular expression search, not LDAP"
code = '''
@app.get("/find")
def find():
    m = re.search(r"^[a-z]+$", request.args.get("q", ""))
    return {"ok": bool(m)}
'''
