id = "python-weak-crypto-password-hash"
lang = "python"
class = "weak-crypto"
cwe = "CWE-916"
severity = "high"
tier = "info"
title = "Password from the request hashed with a fast, unsalted hash"
frameworks = ["django", "flask"]
sources = ["request.form['pass", "request.form.get('pass", "request.POST['pass", "request.POST.get('pass", "request.json['pass", "request.json.get('pass", "request.values.get('pass", "request.args.get('pass"]
sinks = ["hashlib.md5(", "hashlib.sha1(", "hashlib.sha256(", "hashlib.sha512(", "hashlib.new(", "md5(", "sha1("]
sanitizers = []
fix = "Hash passwords with a password hashing function: Django's make_password(), werkzeug's generate_password_hash(), or hashlib.scrypt / bcrypt / argon2 with a random salt."
refs = ["CVE-2020-5229"]

[[samples]]
kind = "vulnerable"
code = '''
@app.route('/register', methods=['POST'])
def register():
    pw = request.form['password']
    db.add(User(name=request.form['name'], pw=hashlib.md5(pw.encode()).hexdigest()))
'''

[[samples]]
kind = "safe"
code = '''
@app.route('/register', methods=['POST'])
def register():
    pw = request.form['password']
    db.add(User(name=request.form['name'], pw=generate_password_hash(pw)))
    etag = hashlib.md5(request.form['name'].encode()).hexdigest()
'''
