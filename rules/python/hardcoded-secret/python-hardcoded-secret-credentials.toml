id = "python-hardcoded-secret-credentials"
lang = "python"
class = "hardcoded-secret"
cwe = "CWE-798"
severity = "medium"
tier = "info"
title = "Password or signing key written in the code"
frameworks = ["django", "flask"]
sources = []
sinks = ["jwt.encode(", "jwt.decode(", "hmac.new(", "psycopg2.connect(", "pymysql.connect(", "mysql.connector.connect(", "MySQLdb.connect(", "ldap_conn.simple_bind_s(", ".simple_bind_s(", "paramiko.SSHClient().connect(", ".login("]
sanitizers = []
fix = "Read credentials and keys from the environment or a secrets store (os.environ, Django settings loaded from the environment), and rotate any value that was committed."
refs = ["CVE-2021-40494"]

[[args]]
sinks = ["jwt.encode(", "jwt.decode("]
arg = 2
literal = true

[[args]]
sinks = ["hmac.new("]
arg = 1
literal = true

[[args]]
sinks = ["psycopg2.connect(", "pymysql.connect(", "mysql.connector.connect(", "MySQLdb.connect(", "paramiko.SSHClient().connect("]
when = ["password=", "passwd="]
literal = true

[[args]]
sinks = ["ldap_conn.simple_bind_s(", ".simple_bind_s(", ".login("]
arg = 2
literal = true

[[samples]]
kind = "vulnerable"
code = '''
token = jwt.encode({'sub': user.id}, '__SECRET__', algorithm='HS256')
'''

[[samples]]
kind = "vulnerable"
code = '''
conn = psycopg2.connect(host='db', user='app', password='__SECRET__', dbname='app')
'''

[[samples]]
kind = "safe"
code = '''
token = jwt.encode({'sub': user.id}, settings.SECRET_KEY, algorithm='HS256')
conn = psycopg2.connect(host='db', user='app', password=os.environ['DB_PASSWORD'], dbname='app')
smtp.login(user, '')
'''
