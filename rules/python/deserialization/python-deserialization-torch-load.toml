id = "python-deserialization-torch-load"
lang = "python"
class = "deserialization"
cwe = "CWE-502"
severity = "critical"
tier = "info"
title = "Uploaded or downloaded file loaded with torch.load or np.load that can unpickle objects"
sources = ["request.files", "request.FILES", "request.data", "request.body", "request.get_data(", "request.read(", "self.request.body", "self.request.files", "file.file", "upload.file", "requests.get(", "urlopen(", "urllib.request.urlopen(", "httpx.get("]
sinks = ["torch.load(", "np.load(", "numpy.load("]
sanitizers = []
fix = "Call torch.load(..., weights_only=True) (or store tensors as safetensors) and np.load with allow_pickle=False; never unpickle a checkpoint or array file that came from a user or the network."
refs = ["CVE-2025-67729", "CVE-2024-34072"]

[[args]]
sinks = ["torch.load("]
unless = ["weights_only=True"]

[[args]]
sinks = ["np.load(", "numpy.load("]
when = ["allow_pickle=True"]

[[samples]]
kind = "vulnerable"
code = '''
@app.post("/checkpoints")
def upload_checkpoint():
    f = request.files["checkpoint"]
    state = torch.load(f, map_location="cpu")
    model.load_state_dict(state)
    return "ok"
'''

[[samples]]
kind = "vulnerable"
code = '''
def predict(request):
    arr = np.load(io.BytesIO(request.body), allow_pickle=True)
    return JsonResponse({"shape": list(arr.shape)})
'''

[[samples]]
kind = "safe"
code = '''
@app.post("/checkpoints")
def upload_checkpoint():
    f = request.files["checkpoint"]
    state = torch.load(f, map_location="cpu", weights_only=True)
    model.load_state_dict(state)
    return "ok"
'''

[[samples]]
kind = "safe"
note = "allow_pickle defaults to False"
code = '''
def predict(request):
    arr = np.load(io.BytesIO(request.body))
    return JsonResponse({"shape": list(arr.shape)})
'''
