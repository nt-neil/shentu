id = "python-code-eval-template-injection"
lang = "python"
class = "code-eval"
cwe = "CWE-1336"
severity = "critical"
title = "User-controlled text compiled as a Jinja2 template (server-side template injection)"
frameworks = ["flask", "django"]
sources = ["request.args", "request.form", "request.json", "request.values", "request.GET", "request.POST", "request.body", "request.query_params", "request.path_params", "request.form(", "request.json(", "request.body(", "request.query", "request.match_info", "request.post(", "request.text(", "request.read(", "self.get_argument(", "self.get_arguments(", "self.get_query_argument(", "self.get_body_argument(", "self.request.body", "self.request.arguments"]
sinks = ["render_template_string(", "Template(", ".from_string(", "jinja2.Template(", "tornado.template.Template(", "mako.template.Template("]
sanitizers = ["SandboxedEnvironment", "ImmutableSandboxedEnvironment"]
fix = "Pass user text as a variable to a fixed template (render_template('page.html', msg=text)); if users must write templates, render them in jinja2.sandbox.SandboxedEnvironment."
refs = ["CVE-2026-104851", "CVE-2024-34359", "CVE-2026-37004", "CVE-2024-45053"]

[[args]]
arg = 1   # the template source; values passed to render are data

[[samples]]
kind = "vulnerable"
code = '''
@app.get("/greet")
def greet():
    name = request.args.get("name", "guest")
    return render_template_string("<h1>Hello " + name + "</h1>")
'''

[[samples]]
kind = "vulnerable"
code = '''
@app.post("/preview")
def preview():
    return Template(request.form["body"]).render(user=current_user)
'''

[[samples]]
kind = "safe"
code = '''
@app.get("/greet")
def greet():
    return render_template_string("<h1>Hello {{ name }}</h1>", name=request.args.get("name", "guest"))
'''

[[samples]]
kind = "safe"
code = '''
env = SandboxedEnvironment()

@app.post("/preview")
def preview():
    return env.from_string(request.form["body"]).render(user_name=current_user.name)
'''

[[samples]]
kind = "vulnerable"
note = "a prompt template sent to a test endpoint is compiled by a plain Environment"
code = '''
jinja_env = Environment(loader=DictLoader({}))

@router.post("/prompts/test")
async def test_prompt(request: Request):
    body = await request.json()
    template = jinja_env.from_string(body["template"])
    return {"rendered": template.render(**body.get("variables", {}))}
'''

[[samples]]
kind = "vulnerable"
code = '''
def preview_email(request):
    tpl = Environment().from_string(request.POST["body"])
    return HttpResponse(tpl.render(user=request.user.get_username()))
'''

[[samples]]
kind = "safe"
code = '''
jinja_env = ImmutableSandboxedEnvironment(loader=DictLoader({}))

@router.post("/prompts/test")
async def test_prompt(request: Request):
    body = await request.json()
    template = jinja_env.from_string(body["template"])
    return {"rendered": template.render(**body.get("variables", {}))}
'''

[[samples]]
kind = "safe"
note = "user text replaces placeholders; it is never compiled"
code = '''
def preview_email(request):
    text = TEMPLATE_BODY.replace("__REASON__", request.POST["reason"])
    return HttpResponse(text, content_type="text/plain")
'''
