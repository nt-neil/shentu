id = "python-code-eval-jinja-unsandboxed"
lang = "python"
class = "code-eval"
cwe = "CWE-1336"
severity = "medium"
tier = "reference"
title = "Text the code does not write out compiled as a Jinja2 template outside a sandbox"
sources = []
sinks = ["jinja2.Template(", ".from_string(", "render_template_string("]
sanitizers = ["SandboxedEnvironment", "ImmutableSandboxedEnvironment"]
fix = "Render fixed templates and pass values as variables; a template whose text may come from a user or a setting belongs in jinja2.sandbox.SandboxedEnvironment."
refs = ["CVE-2026-33154"]

[[args]]
sinks = ["jinja2.Template(", "render_template_string("]
arg = 1   # the template source; values passed to render are data
not_literal = true

[[args]]
sinks = [".from_string("]
arg = 1
not_literal = true
# a Jinja environment: made by jinja2, or, where the file does not show what
# made it, named as Jinja and Flask name one; Engine().from_string is Django's
# own template language
receiver_from = ["jinja2"]
receiver_names = ["env", "jinja_env", "environment", "jinja_environment"]

[[samples]]
kind = "vulnerable"
code = '''
from jinja2 import Environment

env = Environment()

def render_setting(value, **context):
    return env.from_string(value).render(**context)
'''

[[samples]]
kind = "vulnerable"
code = '''
def page(body):
    return jinja2.Template(body).render()
'''

[[samples]]
kind = "safe"
code = '''
env = SandboxedEnvironment()

def render_setting(value, **context):
    return env.from_string(value).render(**context)
'''

[[samples]]
kind = "safe"
code = '''
def greet(name):
    return env.from_string("Hello {{ name }}").render(name=name)
'''

[[samples]]
kind = "vulnerable"
code = '''
import jinja2

def page(body):
    return jinja2.Environment().from_string(body).render()
'''

[[samples]]
kind = "vulnerable"
code = '''
def preview(app, source):
    return app.jinja_env.from_string(source).render()
'''

[[samples]]
kind = "safe"
code = '''
from jinja2.sandbox import SandboxedEnvironment

def page(body):
    return SandboxedEnvironment().from_string(body).render()
'''

[[samples]]
kind = "safe"
code = '''
from django.template import Engine

def page(body):
    return Engine().from_string(body).render()
'''

[[samples]]
kind = "safe"
code = '''
from django.template import Engine

class Page:
    def __init__(self):
        self.engine = Engine(debug=True)

    def render(self, body):
        return self.engine.from_string(body)

    def other(self, body):
        return self.loader.from_string(body)
'''

[[samples]]
kind = "safe"
code = '''
from jinja2 import Environment

env = Engine()

def page(body):
    return env.from_string(body).render()
'''

