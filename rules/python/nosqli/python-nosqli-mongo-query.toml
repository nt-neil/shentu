id = "python-nosqli-mongo-query"
lang = "python"
class = "nosqli"
cwe = "CWE-943"
severity = "high"
tier = "info"
title = "JSON request data placed in a MongoDB query without checking its type"
frameworks = ["django", "flask"]
sources = ["request.json", "request.get_json(", "json.loads(request.body", "json.loads(request.data", "request.data"]
sinks = [".find_one(", ".find(", ".find_one_and_update(", ".find_one_and_delete(", ".update_one(", ".update_many(", ".delete_one(", ".delete_many(", ".count_documents(", ".aggregate(", "$where"]
sanitizers = ["str(", "int(", "isinstance(", "ObjectId("]
text = ["$where"]
fix = "Check that each value is a plain str or int (isinstance) or convert it (str(), int()) before it goes into the query, so a JSON object such as {\"$ne\": null} cannot become an operator; never build $where from input."
refs = ["CVE-2026-55253"]

[[args]]
