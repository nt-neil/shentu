id = "python-cmdi-argument-injection"
lang = "python"
class = "cmdi"
cwe = "CWE-88"
severity = "high"
title = "Untrusted value used as a command-line argument that can start with '-'"
frameworks = ["flask", "django"]
sources = ["request.args", "request.form", "request.GET", "request.POST", ".filename", "request.json", "request.get_json(", "request.query_params", "request.form(", "request.json(", "self.get_argument(", "self.get_body_argument(", "self.get_json_body("]
sinks = ["subprocess.run([", "subprocess.Popen([", "subprocess.check_output([", "subprocess.call(["]
sanitizers = ["os.path.abspath("]
fix = "Put '--' before positional arguments, or reject values starting with '-'; for file names pass os.path.abspath() of the path so it cannot start with '-'."
refs = ["CVE-2026-112900", "CVE-2026-102904"]

[[args]]
unless = ['"--"', '"--end-of-options"']   # everything after it is read as an operand

[[samples]]
kind = "vulnerable"
note = "a value such as --upload-pack=... is read as an option"
code = '''
@app.get("/log")
def log():
    rev = request.args.get("rev", "HEAD")
    out = subprocess.run(["git", "-C", "/srv/repo", "log", "-n", "5", rev], capture_output=True)
    return out.stdout
'''

[[samples]]
kind = "safe"
code = '''
@app.get("/log")
def log():
    rev = request.args.get("rev", "HEAD")
    if rev.startswith("-"):
        abort(400)
    out = subprocess.run(["git", "-C", "/srv/repo", "log", "-n", "5", "--end-of-options", rev], capture_output=True)
    return out.stdout
'''

[[samples]]
kind = "vulnerable"
note = "an extension name from a Tornado handler's JSON body becomes a pip option"
code = '''
class ExtensionHandler(APIHandler):
    async def post(self):
        name = self.get_json_body()["extension"]
        proc = subprocess.run([sys.executable, "-m", "pip", "uninstall", "-y", name], capture_output=True)
        self.finish({"code": proc.returncode})
'''

[[samples]]
kind = "safe"
code = '''
class ExtensionHandler(APIHandler):
    async def post(self):
        name = self.get_json_body()["extension"]
        proc = subprocess.run([sys.executable, "-m", "pip", "uninstall", "-y", "--", name], capture_output=True)
        self.finish({"code": proc.returncode})
'''
