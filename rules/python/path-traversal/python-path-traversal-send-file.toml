[[samples]]
kind = "safe"
note = "the same helpers built on safe_join"
code = '''
from flask import Flask, abort
from werkzeug.utils import safe_join
app = Flask(__name__)

def locate(name):
    full = safe_join(str(DROP_DIR), name)
    if full is None:
        abort(404)
    return full

def sidecar(full):
    return Path(full + ".info")

@app.route("/drop/<path:name>")
def drop_info(name):
    with sidecar(locate(name)).open() as fh:
        return fh.read()
'''

[[samples]]
kind = "vulnerable"
note = "a query value passed through helpers; a prefix check on an unresolved path does not stop .."
code = '''
def locate(name):
    full = (DROP_DIR / name).absolute()
    if not str(full).startswith(str(DROP_DIR)):
        abort(404)
    return full

def sidecar(full):
    return Path(str(full) + ".info")

@app.get("/drop")
def drop_info():
    with sidecar(locate(request.args["name"])).open() as fh:
        return fh.read()
'''

