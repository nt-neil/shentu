id = "python-path-traversal-send-file"
lang = "python"
class = "path-traversal"
cwe = "CWE-22"
severity = "high"
title = "Request value joined into a file path that is opened or sent"
frameworks = ["flask", "django"]
sources = ["request.args", "request.form", "request.files", "request.GET", "request.POST", "request.view_args"]
sinks = ["send_file(", "open(", "FileResponse(", "Path(", ".save("]
sanitizers = ["send_from_directory(", "safe_join(", "secure_filename(", ".is_relative_to(", ".startswith("]
fix = "Use flask.send_from_directory or werkzeug.utils.safe_join (django.utils._os.safe_join); otherwise resolve the path and check it stays under the base directory."
refs = ["CVE-2022-31507", "CVE-2022-31506", "CVE-2025-54140"]

# Werkzeug's FileStorage.filename is the client's name as sent; Django's
# request.FILES names are already reduced to a base name by its parser, and its
# storage checks them again, so request.FILES is not a source here.
# FileStorage.save(dst): the upload itself is the receiver; only a destination
# built from the request is a path problem.
[[args]]
sinks = [".save("]
arg = 1

[[samples]]
kind = "vulnerable"
note = "os.path.join discards the base when the second part is absolute"
code = '''
@app.get("/download")
def download():
    name = request.args["name"]
    return send_file(os.path.join("/srv/app/exports", name))
'''

[[samples]]
kind = "vulnerable"
code = '''
def attachment(request):
    path = "/srv/media/" + request.GET["f"]
    return FileResponse(open(path, "rb"))
'''

[[samples]]
kind = "safe"
code = '''
@app.get("/download")
def download():
    return send_from_directory("/srv/app/exports", request.args["name"])
'''

[[samples]]
kind = "safe"
code = '''
BASE = Path("/srv/media").resolve()

def attachment(request):
    path = (BASE / request.GET["f"]).resolve()
    if not path.is_relative_to(BASE):
        raise Http404
    return FileResponse(path.open("rb"))
'''

[[samples]]
kind = "vulnerable"
note = "the client chooses the uploaded file's name"
code = '''
@app.post("/upload")
def upload():
    f = request.files["file"]
    f.save("/srv/app/uploads/tmp_" + f.filename)
    return "ok"
'''

[[samples]]
kind = "safe"
code = '''
@app.post("/upload")
def upload():
    f = request.files["file"]
    if os.path.splitext(f.filename)[1].lower() not in {".png", ".jpg"}:
        abort(400)
    f.save("/srv/app/uploads/" + secure_filename(f.filename))
    return "ok"
'''

[[samples]]
kind = "safe"
note = "a generated destination: the upload is only the data written"
code = '''
@app.post("/upload")
def upload():
    f = request.files["file"]
    f.save("/srv/app/uploads/%s.bin" % uuid.uuid4().hex)
    return "ok"
'''

[[samples]]
kind = "vulnerable"
code = '''
@app.get("/report")
def report():
    path = os.path.join("/srv/app/reports", request.args["name"])
    return send_file(path)
'''

[[samples]]
kind = "safe"
note = "the resolved path is checked to stay under the base directory"
code = '''
REPORTS = os.path.realpath("/srv/app/reports")

@app.get("/report")
def report():
    path = os.path.realpath(os.path.join(REPORTS, request.args["name"]))
    if not path.startswith(REPORTS + os.sep):
        abort(404)
    return send_file(path)
'''
