id = "python-path-traversal-send-file"
lang = "python"
class = "path-traversal"
cwe = "CWE-22"
severity = "high"
title = "Request value joined into a file path that is opened, sent, listed, copied or removed"
frameworks = ["flask", "django"]
sources = ["request.args", "request.form", "request.files", "request.GET", "request.POST", "request.view_args", "request.query_params", "request.path_params", "request.query", "request.match_info", "self.get_argument(", "self.get_arguments(", "self.get_query_argument(", "self.get_body_argument("]
sinks = ["send_file(", "open(", "FileResponse(", "Path(", ".save(", "web.FileResponse(", "aiofiles.open(", "anyio.open_file(", "os.remove(", "os.unlink(", "os.rmdir(", "shutil.rmtree(", "shutil.copy(", "shutil.copy2(", "shutil.copyfile(", "shutil.copytree(", "shutil.move(", "os.listdir(", "os.scandir(", "zipfile.ZipFile(", "tarfile.open("]
sanitizers = ["send_from_directory(", "safe_join(", "secure_filename(", ".is_relative_to(", ".startswith("]
fix = "Use flask.send_from_directory or werkzeug.utils.safe_join (django.utils._os.safe_join); otherwise resolve the path and check it stays under the base directory."
refs = ["CVE-2022-31507", "CVE-2022-31506", "CVE-2025-54140", "CVE-2026-44716", "GHSA-62mm-xwmv-crhg", "CVE-2020-15239"]

# Werkzeug's FileStorage.filename is the client's name as sent; Django's
# request.FILES names are already reduced to a base name by its parser, and its
# storage checks them again, so request.FILES is not a source here.
# FileStorage.save(dst): the upload itself is the receiver; only a destination
# built from the request is a path problem.
[[args]]
sinks = [".save("]
arg = 1

# Archives: only the path argument; tarfile.open(fileobj=...) reads an open
# stream (an upload), whose members are python-path-traversal-archive-extract's.
[[args]]
sinks = ["tarfile.open("]
arg = 1
name = "name"

[[args]]
sinks = ["zipfile.ZipFile("]
arg = 1
name = "file"

[[samples]]
kind = "vulnerable"
note = "os.path.join discards the base when the second part is absolute"
code = '''
@app.get("/download")
def download():
    name = request.args["name"]
    return send_file(os.path.join("/srv/app/exports", name))
'''

[[samples]]
kind = "vulnerable"
code = '''
def attachment(request):
    path = "/srv/media/" + request.GET["f"]
    return FileResponse(open(path, "rb"))
'''

[[samples]]
kind = "safe"
code = '''
@app.get("/download")
def download():
    return send_from_directory("/srv/app/exports", request.args["name"])
'''

[[samples]]
kind = "safe"
code = '''
BASE = Path("/srv/media").resolve()

def attachment(request):
    path = (BASE / request.GET["f"]).resolve()
    if not path.is_relative_to(BASE):
        raise Http404
    return FileResponse(path.open("rb"))
'''

