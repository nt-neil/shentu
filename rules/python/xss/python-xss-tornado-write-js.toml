id = "python-xss-tornado-write-js"
lang = "python"
class = "xss"
cwe = "CWE-79"
severity = "medium"
tier = "info"
title = "Tornado handler writes a request value inside a script without the escaping that context needs"
sources = ["self.get_argument(", "self.get_arguments(", "self.get_query_argument(", "self.get_query_arguments(", "self.get_body_argument(", "self.get_body_arguments(", "self.get_cookie(", "self.request.arguments", "self.request.query_arguments", "self.request.body_arguments", "self.request.body", "self.request.uri", "self.request.path", "self.request.headers", "self.path_kwargs"]
sinks = ["self.write(", "self.finish("]
sanitizers = ["json_encode(", "escape.json_encode(", "tornado.escape.json_encode(", "int("]
fix = "Pass data to scripts as JSON with tornado.escape.json_encode() (it escapes '</'), never inside a hand-written string literal."
refs = ["CVE-2024-35225"]

# RequestHandler.write sends text/html unless the handler sets another type;
# a dict is sent as JSON, which the context condition leaves out.
[[args]]
context = ["js"]

[[samples]]
kind = "vulnerable"
code = '''
class Widget(tornado.web.RequestHandler):
    def get(self):
        theme = self.get_argument("theme", "light")
        self.write("<script>window.widgetTheme = '" + theme + "';</script>")
'''

[[samples]]
kind = "safe"
code = '''
class Widget(tornado.web.RequestHandler):
    def get(self):
        theme = self.get_argument("theme", "light")
        self.write("<script>window.widgetTheme = " + tornado.escape.json_encode(theme) + ";</script>")
'''
