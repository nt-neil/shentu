id = "python-xss-aiohttp-text-attr"
lang = "python"
class = "xss"
cwe = "CWE-79"
severity = "medium"
tier = "info"
title = "aiohttp text/html response with a request value in an attribute value without the escaping that context needs"
sources = ["request.query", "request.match_info", "request.post(", "request.text(", "request.rel_url", "request.path", "request.headers", "request.cookies"]
sinks = ["web.Response(", "aiohttp.web.Response("]
sanitizers = ["html.escape(", "escape(", "markupsafe.escape(", "urllib.parse.quote(", "quote("]
fix = "Escape the value with html.escape() (it escapes quotes by default) before writing it into an attribute, or render with aiohttp_jinja2 and autoescape."
refs = ["CVE-2024-27306"]

# web.Response(body, status, reason, text, ..., content_type): the page is the
# text= argument, rendered only as text/html. Input written into a quoted
# attribute value (between tags: python-xss-aiohttp-text-html).
[[args]]
arg = 4
name = "text"
when = ['content_type="text/html"', "content_type='text/html'"]
context = ["attr"]

[[samples]]
kind = "vulnerable"
code = '''
async def avatar(request):
    who = request.query.get("user", "guest")
    return web.Response(text='<img class="avatar" title="' + who + '" src="/static/a.png">', content_type="text/html")
'''

[[samples]]
kind = "safe"
code = '''
async def avatar(request):
    who = html.escape(request.query.get("user", "guest"))
    return web.Response(text='<img class="avatar" title="' + who + '" src="/static/a.png">', content_type="text/html")
'''

[[samples]]
kind = "safe"
note = "text/plain is not rendered as HTML"
code = '''
async def avatar(request):
    return web.Response(text='title="' + request.query.get("user", "guest") + '"')
'''
