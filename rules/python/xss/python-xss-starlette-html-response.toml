id = "python-xss-starlette-html-response"
lang = "python"
class = "xss"
cwe = "CWE-79"
severity = "medium"
tier = "info"
title = "FastAPI or Starlette HTMLResponse built from a request value without escaping"
sources = ["request.query_params", "request.path_params", "request.form(", "request.json(", "request.body(", "request.headers", "request.cookies", "request.url.path"]
sinks = ["HTMLResponse(", "responses.HTMLResponse(", "fastapi.responses.HTMLResponse(", "starlette.responses.HTMLResponse(", "Response("]
sanitizers = ["html.escape(", "escape(", "markupsafe.escape(", "json_script("]
fix = "Render HTML with Jinja2Templates (it escapes by default), or escape each value with html.escape(); inside <script> emit values with a JSON encoder that also escapes '<', never inside a hand-written string literal."
refs = ["CVE-2026-54386"]

[[args]]
sinks = ["HTMLResponse(", "responses.HTMLResponse(", "fastapi.responses.HTMLResponse(", "starlette.responses.HTMLResponse("]
context = ["html", "attr", "url", "js"]

[[args]]
sinks = ["Response("]
when = ['media_type="text/html"', "media_type='text/html'"]
context = ["html", "attr", "url", "js"]

[[samples]]
kind = "vulnerable"
note = "a query value placed in a JavaScript string literal"
code = '''
@app.get("/notebook")
async def notebook(request: Request):
    key = request.query_params.get("file", "")
    return HTMLResponse(f"<html><body><script>const notebookId = '{key}';</script></body></html>")
'''

[[samples]]
kind = "vulnerable"
code = '''
@app.get("/search")
async def search(request: Request):
    q = request.query_params.get("q", "")
    html = "<h1>No results for " + q + "</h1>"
    return Response(content=html, media_type="text/html")
'''

[[samples]]
kind = "safe"
code = '''
@app.get("/search")
async def search(request: Request):
    q = request.query_params.get("q", "")
    return HTMLResponse("<h1>No results for " + html.escape(q) + "</h1>")
'''

[[samples]]
kind = "safe"
note = "templates escape the values they are given"
code = '''
@app.get("/search")
async def search(request: Request):
    q = request.query_params.get("q", "")
    return templates.TemplateResponse(request, "search.html", {"q": q})
'''
