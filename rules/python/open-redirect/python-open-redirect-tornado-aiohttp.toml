id = "python-open-redirect-tornado-aiohttp"
lang = "python"
class = "open-redirect"
cwe = "CWE-601"
severity = "medium"
tier = "info"
title = "Tornado or aiohttp redirect to a URL taken from the request"
sources = ["self.get_argument(", "self.get_query_argument(", "self.get_body_argument(", "self.request.arguments", "self.request.query_arguments", "self.request.headers", "request.query", "request.match_info", "request.post(", "request.headers"]
sinks = ["self.redirect(", "web.HTTPFound(", "web.HTTPSeeOther(", "web.HTTPTemporaryRedirect(", "web.HTTPMovedPermanently(", "web.HTTPPermanentRedirect(", "HTTPFound(", "HTTPSeeOther("]
sanitizers = ["url_has_allowed_host_and_scheme(", "is_safe_url(", "self.reverse_url(", "reverse_url(", ".url_for("]
fix = "Redirect only to a fixed page or a path you build on the server (reverse_url, router url_for); if a 'next' value must be honoured, check its host with url_has_allowed_host_and_scheme() — a prefix check such as startswith('/') is not enough, since browsers drop tabs and newlines and '/\\t/evil.example' becomes '//evil.example'."
refs = ["CVE-2024-53995"]

[[args]]
arg = 1
leading = true

[[samples]]
kind = "vulnerable"
code = '''
class SignIn(tornado.web.RequestHandler):
    def post(self):
        account = self.authenticate(self.get_body_argument("login"), self.get_body_argument("secret"))
        if account is None:
            raise tornado.web.HTTPError(403)
        self.redirect(self.get_query_argument("return_to", "/"))
'''

[[samples]]
kind = "vulnerable"
code = '''
async def sign_out(request):
    await drop_session(request)
    raise web.HTTPFound(request.query.get("after", "/"))
'''

[[samples]]
kind = "vulnerable"
note = "the Referer header is chosen by whoever links to the page"
code = '''
async def go_back(request):
    raise web.HTTPSeeOther(request.headers.get("Referer", "/"))
'''

[[samples]]
kind = "safe"
code = '''
class SignIn(tornado.web.RequestHandler):
    def post(self):
        account = self.authenticate(self.get_body_argument("login"), self.get_body_argument("secret"))
        if account is None:
            raise tornado.web.HTTPError(403)
        self.redirect(self.reverse_url("dashboard"))
'''

[[samples]]
kind = "safe"
note = "a host check, not a prefix check"
code = '''
class SignIn(tornado.web.RequestHandler):
    def get(self):
        dest = self.get_argument("return_to", "/")
        if not url_has_allowed_host_and_scheme(dest, allowed_hosts={self.request.host}):
            dest = "/"
        self.redirect(dest)
'''

[[samples]]
kind = "safe"
code = '''
async def open_item(request):
    raise web.HTTPFound(request.app.router["item"].url_for(item_id=request.match_info["item_id"]))
'''

[[samples]]
kind = "vulnerable"
note = "a prefix check: '/\t/evil.example' passes it and the browser makes it '//evil.example'"
code = '''
class SignIn(tornado.web.RequestHandler):
    def get(self):
        dest = self.get_argument("return_to", "/")
        if not dest.startswith("/") or dest.startswith("//") or dest.startswith("/\\"):
            dest = "/"
        self.redirect(dest)
'''
