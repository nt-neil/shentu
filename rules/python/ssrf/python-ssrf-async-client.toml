lang = "python"
class = "ssrf"
cwe = "CWE-918"
severity = "high"
tier = "info"
title = "httpx, aiohttp or Tornado client fetches a URL taken from the request"
sources = ["request.query_params", "request.path_params", "request.form(", "request.json(", "request.body(", "request.query", "request.match_info", "request.post(", "self.get_argument(", "self.get_query_argument(", "self.get_body_argument(", "self.request.body", "request.args", "request.form", "request.values", "request.json", "request.get_json(", "request.GET", "request.POST", "request.data"]
