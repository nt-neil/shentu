[[samples]]
kind = "vulnerable"
note = "a callback URL from the request body"
code = '''
@app.post("/run")
async def run(request: Request):
    body = await request.json()
    result = await execute(body["job"])
    async with httpx.AsyncClient(timeout=10) as client:
        await client.post(body["callback_url"], json=result)
    return {"queued": True}
'''

[[samples]]
kind = "vulnerable"
code = '''
async def preview(request):
    url = request.query["url"]
    async with aiohttp.ClientSession() as session:
        async with session.get(url) as resp:
            return web.json_response({"status": resp.status})
'''

[[samples]]
kind = "vulnerable"
code = '''
class FetchHandler(tornado.web.RequestHandler):
    async def get(self):
        http_client = AsyncHTTPClient()
        resp = await http_client.fetch(self.get_argument("url"))
        self.write({"size": len(resp.body)})
'''

[[samples]]
kind = "safe"
note = "scheme and host are fixed; the request picks only the item"
code = '''
@app.get("/items")
async def item(request: Request):
    item_id = request.query_params["id"]
    async with httpx.AsyncClient() as client:
        resp = await client.get(f"https://api.example.com/items/{item_id}")
    return resp.json()
'''

[[samples]]
kind = "safe"
note = "SQLAlchemy session.get takes the model first"
code = '''
@app.route("/user")
def user():
    u = session.get(User, request.args["id"])
    return {"name": u.name}
'''
