[[samples]]
kind = "vulnerable"
note = "a notification URL from the job request"
code = '''
@api.post("/jobs")
async def submit_job(request: Request):
    payload = await request.json()
    outcome = await process(payload["spec"])
    async with httpx.AsyncClient(timeout=5) as http_client:
        await http_client.post(payload["notify_url"], json={"outcome": outcome})
    return {"accepted": True}
'''

[[samples]]
kind = "vulnerable"
code = '''
@api.get("/peek")
async def peek(request: Request):
    reply = await httpx.AsyncClient().get(request.query_params["target"])
    return {"code": reply.status_code}
'''

[[samples]]
kind = "vulnerable"
code = '''
class Mirror(tornado.web.RequestHandler):
    async def get(self):
        http_client = AsyncHTTPClient()
        reply = await http_client.fetch(self.get_argument("src"))
        self.write({"bytes": len(reply.body)})
'''

[[samples]]
kind = "safe"
note = "scheme and host are fixed; the request picks only the record"
code = '''
@api.get("/records")
async def record(request: Request):
    rid = request.query_params["rid"]
    async with httpx.AsyncClient() as http_client:
        reply = await http_client.get(f"https://records.example.org/v1/{rid}")
    return reply.json()
'''

[[samples]]
kind = "safe"
note = "a Redis client and Flask's session are not HTTP clients"
code = '''
@app.route("/pref")
def pref():
    theme = client.get(request.args["key"])
    last = session.get(request.args["field"])
    return {"theme": theme, "last": last}
'''
