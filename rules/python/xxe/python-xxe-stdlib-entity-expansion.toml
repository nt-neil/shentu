id = "python-xxe-stdlib-entity-expansion"
lang = "python"
class = "xxe"
cwe = "CWE-776"
severity = "medium"
tier = "info"
title = "Untrusted XML parsed with xml.etree or minidom instead of defusedxml"
frameworks = ["django", "flask"]
sources = ["request.data", "request.body", "request.get_data(", "request.files", "request.FILES", "request.form", "request.POST", "request.body(", "request.read(", "self.request.body", "requests.get(", "urlopen(", "urllib.request.urlopen(", "httpx.get("]
sinks = ["ElementTree.fromstring(", "ET.fromstring(", "ET.XML(", "ET.parse(", "ET.iterparse(", "xml.etree.ElementTree.fromstring(", "xml.etree.ElementTree.parse(", "minidom.parseString(", "minidom.parse(", "xml.dom.minidom.parseString(", "pulldom.parseString(", "xml.sax.parseString("]
sanitizers = []
fix = "Parse untrusted XML with defusedxml (defusedxml.ElementTree.fromstring, defusedxml.minidom), which refuses entity declarations and external references."
refs = ["CVE-2025-3225", "CVE-2016-10149"]

[[args]]
arg = 1

[[samples]]
kind = "vulnerable"
code = '''
def load_sitemap(url):
    resp = requests.get(url, timeout=10)
    root = ET.fromstring(resp.content)
    return [loc.text for loc in root.iter("{*}loc")]
'''

[[samples]]
kind = "vulnerable"
code = '''
def acs(request):
    xml_string = base64.b64decode(request.POST["SAMLResponse"])
    tree = ElementTree.fromstring(xml_string)
    return HttpResponse(tree.tag)
'''

[[samples]]
kind = "safe"
code = '''
def load_sitemap(url):
    resp = requests.get(url, timeout=10)
    root = defusedxml.ElementTree.fromstring(resp.content)
    return [loc.text for loc in root.iter("{*}loc")]
'''

[[samples]]
kind = "safe"
note = "a file shipped with the application"
code = '''
def load_defaults():
    return ET.parse(os.path.join(BASE_DIR, "defaults.xml")).getroot()
'''
