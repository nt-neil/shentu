id = "php-path-traversal-symfony-file-response"
lang = "php"
class = "path-traversal"
cwe = "CWE-22"
severity = "high"
tier = "info"
title = "Symfony file response sends a path taken from the request"
frameworks = ["laravel"]
sources = ["$request->query->get(", "$request->request->get(", "$request->get(", "$request->query->all(", "$request->input(", "$request->query(", "$_GET", "$_POST", "$_REQUEST"]
sinks = ["BinaryFileResponse(", "$this->file(", "SplFileObject("]
sanitizers = ["basename(", "absint", "intval", "in_array", "ctype_digit", "ctype_alnum"]
fix = "Take only a file name from the request (basename()), join it to a fixed directory and check that realpath() of the result stays inside that directory, or look the file up by an id."
refs = ["CVE-2026-107844"]

[[args]]
arg = 1

[[samples]]
kind = "vulnerable"
code = '''
<?php
class DownloadController extends AbstractController
{
    public function invoice(Request $request): Response
    {
        $name = $request->query->get('file');
        return new BinaryFileResponse($this->getParameter('invoice_dir') . '/' . $name);
    }
}
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
class ExportController extends AbstractController
{
    public function get(Request $request): Response
    {
        return $this->file('/srv/exports/' . $request->get('name'));
    }
}
'''

[[samples]]
kind = "safe"
code = '''
<?php
class DownloadController extends AbstractController
{
    public function invoice(Request $request): Response
    {
        $name = basename($request->query->get('file'));
        return new BinaryFileResponse($this->getParameter('invoice_dir') . '/' . $name);
    }
}
'''
