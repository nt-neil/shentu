id = "php-sqli-orderby-identifier"
lang = "php"
class = "sqli"
cwe = "CWE-89"
severity = "high"
title = "Sort column or direction taken from the request and placed into ORDER BY"
frameworks = ["laravel", "wordpress"]
# Yii's request readers as php-sqli-yii-query has them: ->orderBy( is this rule's.
# WordPress's readers as php-sqli-wpdb-unprepared and php-sqli-prepare-query-text
# have them: input that is only an ORDER BY identifier is this rule's.
sources = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "get_query_var(", "->get_param(", "$request['", "shortcode_atts(", "$atts[", "->get_json_params(", "->get_body_params(", "->get_query_params(", "$request->input(", "$request->get(", "request(", "Yii::$app->request->get(", "$request->query->get(", "$request->request->get(", "$request->attributes->get(",
           "->request->get(", "->request->post(", "->request->getQueryParam(", "->request->getBodyParam(", "->request->getParam(", "->request->getQuery(", "->request->getPost(",
           "->getRequest()->get(", "->getRequest()->post(", "->getRequest()->getParam(", "$request->post(", "$request->getQueryParam(", "$request->getBodyParam("]
sinks = ["->orderByRaw(", "::orderByRaw(", "DB::raw", "->orderBy(", "::orderBy(", "ORDER BY"]
sanitizers = ["in_array", "sanitize_sql_orderby", "Rule::in", "absint", "intval", "(int)", "count(", "sizeof("]
fix = "Identifiers cannot be bound as parameters: map the requested sort key to a fixed allowlist of column names and force the direction to ASC or DESC."
refs = ["CVE-2026-13357"]
text = ["ORDER BY"]

# Yii: orderBy([$column => SORT_ASC]) quotes nothing in the key; the value is
# only compared with SORT_DESC.
[[args]]
sinks = ["->orderBy(", "::orderBy("]
keys = true

[[samples]]
kind = "vulnerable"
note = "orderByRaw puts the string into SQL unchanged"
code = '''
<?php
public function index(Request $request)
{
    $sort = $request->input('sort', 'created_at');
    return Payment::query()->orderByRaw($sort . ' ' . $request->input('dir', 'desc'))->paginate();
}
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
$orderby = $_GET['orderby'];
$rows = $wpdb->get_results("SELECT * FROM {$wpdb->prefix}feeds ORDER BY $orderby");
'''

[[samples]]
kind = "safe"
code = '''
<?php
$allowed = ['created_at', 'amount', 'status'];
$sort = $request->input('sort');
if (!in_array($sort, $allowed, true)) {
    $sort = 'created_at';
}
$dir = $request->input('dir') === 'asc' ? 'asc' : 'desc';
return Payment::query()->orderBy($sort, $dir)->paginate();
'''

[[samples]]
kind = "vulnerable"
note = "Yii: the column name is the array key"
code = '''
<?php
$sort = Yii::$app->request->get('sort', 'id');
$rows = Post::find()->orderBy([$sort => SORT_DESC])->all();
'''

[[samples]]
kind = "safe"
note = "Yii: the request picks only the direction, an array value"
code = '''
<?php
$rows = Post::find()->orderBy(['created_at' => Yii::$app->request->get('dir')])->all();
'''

[[samples]]
kind = "safe"
note = "->request( is a method of another object, not Laravel's request() helper"
code = '''
<?php
$sort = $this->settings->request('default_sort');
$rows = DB::table('posts')->orderBy($sort)->get();
'''

[[samples]]
kind = "vulnerable"
note = "Yii: a column taken from the request as the key of orderBy()"
code = '''
<?php
class StockController extends Controller
{
    public function actionTable()
    {
        [$field, $dir] = explode('|', (string) $this->request->getParam('sort', 'name|asc'));
        $rows = Item::find()->orderBy($field . ' ' . $dir)->limit(50)->all();
        return $this->asJson($rows);
    }
}
'''

[[samples]]
kind = "vulnerable"
note = "the failed check only logs, the query still runs"
code = '''
<?php
$col = $_GET['orderby'];
if (!in_array($col, array('date', 'title'), true)) {
    error_log('unexpected orderby');
}
$rows = $wpdb->get_results("SELECT * FROM {$wpdb->posts} ORDER BY $col");
'''

[[samples]]
kind = "safe"
note = "wp_send_json_error ends the request, so after it the column is one of the two"
code = '''
<?php
$col = $_GET['orderby'];
if (!in_array($col, array('date', 'title'), true)) {
    wp_send_json_error('bad orderby');
}
$rows = $wpdb->get_results("SELECT * FROM {$wpdb->posts} ORDER BY $col");
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
function shop_items($req) {
    global $wpdb;
    $col = $req->get_param('sort');
    return $wpdb->get_results($wpdb->prepare("SELECT * FROM {$wpdb->prefix}items ORDER BY $col LIMIT %d", 10));
}
'''
