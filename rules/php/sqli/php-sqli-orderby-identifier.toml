id = "php-sqli-orderby-identifier"
lang = "php"
class = "sqli"
cwe = "CWE-89"
severity = "high"
title = "Sort column or direction taken from the request and placed into ORDER BY"
frameworks = ["laravel", "wordpress"]
sources = ["$_GET", "$_POST", "$_REQUEST", "$request->input(", "$request->get(", "request(", "Yii::$app->request->get("]
sinks = ["->orderByRaw(", "::orderByRaw(", "DB::raw", "->orderBy(", "::orderBy(", "ORDER BY"]
sanitizers = ["in_array", "sanitize_sql_orderby", "Rule::in"]
fix = "Identifiers cannot be bound as parameters: map the requested sort key to a fixed allowlist of column names and force the direction to ASC or DESC."
refs = ["CVE-2026-13357"]
text = ["ORDER BY"]

# Yii: orderBy([$column => SORT_ASC]) quotes nothing in the key; the value is
# only compared with SORT_DESC.
[[args]]
sinks = ["->orderBy(", "::orderBy("]
keys = true

[[samples]]
kind = "vulnerable"
note = "orderByRaw puts the string into SQL unchanged"
code = '''
<?php
public function index(Request $request)
{
    $sort = $request->input('sort', 'created_at');
    return Payment::query()->orderByRaw($sort . ' ' . $request->input('dir', 'desc'))->paginate();
}
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
$orderby = $_GET['orderby'];
$rows = $wpdb->get_results("SELECT * FROM {$wpdb->prefix}feeds ORDER BY $orderby");
'''

[[samples]]
kind = "safe"
code = '''
<?php
$allowed = ['created_at', 'amount', 'status'];
$sort = $request->input('sort');
if (!in_array($sort, $allowed, true)) {
    $sort = 'created_at';
}
$dir = $request->input('dir') === 'asc' ? 'asc' : 'desc';
return Payment::query()->orderBy($sort, $dir)->paginate();
'''

[[samples]]
kind = "vulnerable"
note = "Yii: the column name is the array key"
code = '''
<?php
$sort = Yii::$app->request->get('sort', 'id');
$rows = Post::find()->orderBy([$sort => SORT_DESC])->all();
'''

[[samples]]
kind = "safe"
note = "Yii: the request picks only the direction, an array value"
code = '''
<?php
$rows = Post::find()->orderBy(['created_at' => Yii::$app->request->get('dir')])->all();
'''

[[samples]]
kind = "safe"
note = "->request( is a method of another object, not Laravel's request() helper"
code = '''
<?php
$sort = $this->settings->request('default_sort');
$rows = DB::table('posts')->orderBy($sort)->get();
'''
