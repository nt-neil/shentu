id = "php-sqli-drupal-db-query"
lang = "php"
class = "sqli"
cwe = "CWE-89"
severity = "high"
tier = "info"
title = "Request input written into the SQL text of a Drupal database query"
sources = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "->query->get(", "->request->get(", "::request()->get(", "$form_state->getValue(", "$form_state->getUserInput(", "arg(", "filter_input(", "->filterInput(", "->filter_input("]
sinks = ["db_query(", "db_query_range(", "\\Drupal::database()->query(", "$this->database->query(", "$this->connection->query(", "$connection->query(", "$database->query(", "Database::getConnection()->query(", "->where("]
# ->where( is a Yii, a CodeIgniter and a Doctrine call as well: on the same
# call, input those rules read too is theirs (yields.go: Symfony's
# $request->query->get( is Doctrine's); Drupal's own input stays here.
yields_to = ["php-sqli-yii-query", "php-sqli-codeigniter-query", "php-sqli-doctrine-query-text"]
sanitizers = ["(int)", "intval", "in_array", "ctype_digit"]
fix = "Keep the SQL text fixed and pass values as named placeholders in the arguments array (db_query('... WHERE nid = :nid', [':nid' => $nid])), or use the condition() builder, which binds values."
refs = ["CVE-2015-7877"]

[[args]]
arg = 1
whole = true

[[samples]]
kind = "vulnerable"
code = '''
<?php
function mymodule_save_layout() {
    $region = $_POST['region'];
    db_query("UPDATE {mymodule_blocks} SET region = '" . $region . "' WHERE uid = :uid", array(':uid' => $GLOBALS['user']->uid));
}
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
class ReportController extends ControllerBase {
  public function search() {
    $term = \Drupal::request()->query->get('term');
    $rows = $this->database->query("SELECT nid, title FROM {node_field_data} WHERE title LIKE '%$term%'")->fetchAll();
    return ['#theme' => 'item_list', '#items' => array_column($rows, 'title')];
  }
}
'''

[[samples]]
kind = "safe"
note = "the fix: placeholders, the value in the arguments array"
code = '''
<?php
function mymodule_save_layout() {
    db_query("UPDATE {mymodule_blocks} SET region = :region WHERE uid = :uid", array(':region' => $_POST['region'], ':uid' => $GLOBALS['user']->uid));
}
'''

[[samples]]
kind = "safe"
code = '''
<?php
class ReportController extends ControllerBase {
  public function search() {
    $term = \Drupal::request()->query->get('term');
    $rows = $this->database->query('SELECT nid, title FROM {node_field_data} WHERE title LIKE :t', [':t' => '%' . $this->database->escapeLike($term) . '%'])->fetchAll();
    return ['#theme' => 'item_list', '#items' => array_column($rows, 'title')];
  }
}
'''

# filter_input(INPUT_GET, ...) and an application's filterInput(INPUT_POST, ...) wrapper read the request like $_GET and $_POST
[[source_args]]
sources = ["filter_input(", "->filterInput(", "->filter_input("]
arg = 1
values = ["INPUT_GET", "INPUT_POST", "INPUT_COOKIE"]
