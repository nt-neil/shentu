id = "php-sqli-string-concat"
lang = "php"
class = "sqli"
cwe = "CWE-89"
severity = "high"
title = "Request input concatenated or interpolated into a SQL string"
sources = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE"]
sinks = ["mysqli_query", "->query(", "->exec(", "pg_query"]
sanitizers = ["intval", "(int)", "->prepare(", "pg_query_params"]
fix = "Use a prepared statement with bound parameters (PDO::prepare + execute, mysqli bind_param); never build SQL with string concatenation or sprintf. Escaping (mysqli_real_escape_string) only protects a value inside quotes."
refs = ["CVE-2026-56738"]

[[samples]]
kind = "vulnerable"
code = '''
<?php
$name = $_GET['name'];
$sql = "SELECT id, email FROM users WHERE name = '" . $name . "'";
$rows = mysqli_query($db, $sql);
'''

[[samples]]
kind = "vulnerable"
note = "sprintf does not escape anything"
code = '''
<?php
$word = $_POST['word'];
$pdo->exec(sprintf("INSERT INTO stopwords (word) VALUES ('%s')", $word));
'''

[[samples]]
kind = "vulnerable"
note = "escaping only helps inside quotes; here the value is unquoted"
code = '''
<?php
$id = mysqli_real_escape_string($db, $_GET['id']);
$rows = mysqli_query($db, "SELECT * FROM posts WHERE id = $id");
'''

[[samples]]
kind = "safe"
code = '''
<?php
$stmt = $pdo->prepare('SELECT id, email FROM users WHERE name = ?');
$stmt->execute([$_GET['name']]);
'''

[[samples]]
kind = "safe"
note = "integer cast leaves nothing to inject"
code = '''
<?php
$id = intval($_GET['id']);
$rows = mysqli_query($db, "SELECT * FROM posts WHERE id = $id");
'''

[[samples]]
kind = "safe"
note = "WordPress's query classes take an array of arguments and build the SQL themselves, escaping it"
code = '''
<?php
$q = new WP_Query;
$posts = $q->query(array('s' => $_GET['s'], 'post_type' => 'post'));
$users = (new WP_User_Query())->query(array('search' => $_GET['user']));
'''

[[samples]]
kind = "vulnerable"
note = "a receiver the file says nothing about may be a database connection"
code = '''
<?php
function rows($db) {
	return $db->query("SELECT * FROM t WHERE name = '" . $_GET['name'] . "'");
}
'''

# WordPress's *_Query classes: query() takes an arguments array, not SQL.
[[args]]
sinks = ["->query("]
not_receiver = ["WP_Query", "WP_Comment_Query", "WP_User_Query", "WP_Term_Query", "WP_Site_Query", "WP_Network_Query"]
