id = "php-sqli-laravel-raw"
lang = "php"
class = "sqli"
cwe = "CWE-89"
severity = "high"
tier = "info"
title = "Request input written into raw SQL of the Laravel query builder"
frameworks = ["laravel"]
sources = ["$request->input(", "$request->get(", "$request->query(", "$request->post(", "$request->all(", "$request->string(", "request(", "request()->input(", "Request::input(", "$_GET", "$_POST", "$_REQUEST"]
sinks = ["DB::select(", "DB::selectOne(", "DB::statement(", "DB::unprepared(", "DB::insert(", "DB::update(", "DB::delete(", "DB::cursor(",
         "->whereRaw(", "->orWhereRaw(", "->selectRaw(", "->havingRaw(", "->orHavingRaw(", "->groupByRaw(",
         "::whereRaw(", "::orWhereRaw(", "::selectRaw(", "::havingRaw("]
sanitizers = ["intval", "(int)", "in_array", "Rule::in"]
fix = "Keep the SQL text fixed and pass values as bindings, the second argument (DB::select('... where id = ?', [$id]), whereRaw('name like ?', [\"%$q%\"])), or use where() and the other builder methods, which bind for you."
refs = ["CVE-2025-65103"]

[[args]]
arg = 1

[[samples]]
kind = "vulnerable"
code = '''
<?php
class ReportController extends Controller
{
    public function byRegion(Request $request)
    {
        $region = $request->input('region');
        return DB::select("SELECT city, SUM(total) AS total FROM sales WHERE region = '$region' GROUP BY city");
    }
}
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
class ProductController extends Controller
{
    public function search(Request $request)
    {
        $q = $request->query('q');
        return Product::whereRaw("name LIKE '%" . $q . "%'")->paginate(20);
    }
}
'''

[[samples]]
kind = "safe"
code = '''
<?php
class ReportController extends Controller
{
    public function byRegion(Request $request)
    {
        return DB::select('SELECT city, SUM(total) AS total FROM sales WHERE region = ? GROUP BY city', [$request->input('region')]);
    }
}
'''

[[samples]]
kind = "safe"
code = '''
<?php
class ProductController extends Controller
{
    public function search(Request $request)
    {
        $q = $request->query('q');
        return Product::whereRaw('name LIKE ?', ['%' . $q . '%'])->paginate(20);
    }
}
'''
