id = "php-sqli-wpdb-unprepared"
lang = "php"
class = "sqli"
cwe = "CWE-89"
severity = "high"
title = "WordPress $wpdb query built from request input without $wpdb->prepare"
frameworks = ["wordpress"]
sources = ["$_GET", "$_POST", "$_REQUEST", "get_query_var(", "->get_param("]
sinks = ["$wpdb->query", "$wpdb->get_results", "$wpdb->get_row", "$wpdb->get_var", "$wpdb->get_col", "$wpdb->prepare("]
sanitizers = ["$wpdb->prepare", "absint", "intval"]
fix = "Pass every value through $wpdb->prepare() placeholders (%d, %s); sanitize_text_field() and esc_sql() alone do not make a value safe in SQL."
refs = ["CVE-2025-7036"]

# prepare() binds only the values after the format string: input written
# into the format itself is SQL, and prepare cleans just what it binds.
[[args]]
sinks = ["$wpdb->prepare("]
arg = 1

[[samples]]
kind = "vulnerable"
note = "sanitize_text_field strips tags, not quotes"
code = '''
<?php
$uid = sanitize_text_field($_GET['id']);
$row = $wpdb->get_row("SELECT * FROM {$wpdb->prefix}answers WHERE user_id = $uid");
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
add_action('wp_ajax_find_items', function () {
    global $wpdb;
    $q = $_POST['search'];
    $items = $wpdb->get_results("SELECT * FROM {$wpdb->prefix}items WHERE title LIKE '%$q%'");
    wp_send_json($items);
});
'''

[[samples]]
kind = "safe"
code = '''
<?php
$row = $wpdb->get_row($wpdb->prepare(
    "SELECT * FROM {$wpdb->prefix}answers WHERE user_id = %d",
    $_GET['id']
));
'''

[[samples]]
kind = "safe"
code = '''
<?php
$like = '%' . $wpdb->esc_like($_POST['search']) . '%';
$items = $wpdb->get_results($wpdb->prepare("SELECT * FROM {$wpdb->prefix}items WHERE title LIKE %s", $like));
'''

[[samples]]
kind = "vulnerable"
note = "array_map with trim keeps each value as it came"
code = '''
<?php
$ids = array_map('trim', $_POST['ids']);
$wpdb->query("DELETE FROM {$wpdb->prefix}items WHERE id IN (" . implode(',', $ids) . ")");
'''

[[samples]]
kind = "safe"
note = "array_map with absint makes every value a number"
code = '''
<?php
$ids = array_map('absint', $_POST['ids']);
$wpdb->query("DELETE FROM {$wpdb->prefix}items WHERE id IN (" . implode(',', $ids) . ")");
'''

[[samples]]
kind = "vulnerable"
note = "the failed check only logs, the query still runs"
code = '''
<?php
$col = $_GET['orderby'];
if (!in_array($col, array('date', 'title'), true)) {
    error_log('unexpected orderby');
}
$rows = $wpdb->get_results("SELECT * FROM {$wpdb->posts} ORDER BY $col");
'''

[[samples]]
kind = "safe"
note = "wp_send_json_error ends the request, so after it the column is one of the two"
code = '''
<?php
$col = $_GET['orderby'];
if (!in_array($col, array('date', 'title'), true)) {
    wp_send_json_error('bad orderby');
}
$rows = $wpdb->get_results("SELECT * FROM {$wpdb->posts} ORDER BY $col");
'''

[[samples]]
kind = "vulnerable"
note = "extract makes $id from the shortcode attributes"
code = '''
<?php
extract(shortcode_atts(array('id' => 0, 'title' => ''), $_REQUEST));
$row = $wpdb->get_row("SELECT * FROM {$wpdb->prefix}items WHERE id = $id");
'''

[[samples]]
kind = "safe"
code = '''
<?php
extract(shortcode_atts(array('id' => 0, 'title' => ''), $_REQUEST));
$row = $wpdb->get_row("SELECT * FROM {$wpdb->prefix}items WHERE id = " . absint($id));
'''

[[samples]]
kind = "vulnerable"
note = "prepare binds only the values after the format: input written into the format is SQL"
code = '''
<?php
add_action('wp_ajax_drop_items', function () {
    global $wpdb;
    $wpdb->query($wpdb->prepare("DELETE FROM {$wpdb->prefix}items WHERE id IN ({$_POST['ids']}) AND owner = %d", get_current_user_id()));
});
'''

[[samples]]
kind = "safe"
note = "the input is bound as a value, not written into the format"
code = '''
<?php
add_action('wp_ajax_drop_item', function () {
    global $wpdb;
    $wpdb->query($wpdb->prepare("DELETE FROM {$wpdb->prefix}items WHERE id = %d AND owner = %d", $_POST['id'], get_current_user_id()));
});
'''
