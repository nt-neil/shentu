id = "php-sqli-wpdb-unprepared"
lang = "php"
class = "sqli"
cwe = "CWE-89"
severity = "high"
title = "WordPress $wpdb query built from request input without $wpdb->prepare"
frameworks = ["wordpress"]
sources = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "get_query_var(", "->get_param(", "filter_input(", "->filterInput(", "->filter_input("]
sinks = ["$wpdb->query", "$wpdb->get_results", "$wpdb->get_row", "$wpdb->get_var", "$wpdb->get_col"]
sanitizers = ["$wpdb->prepare", "absint", "intval", "(int)", "count(", "sizeof(", "sanitize_sql_orderby("]
fix = "Pass every value through $wpdb->prepare() placeholders (%d, %s); sanitize_text_field() and esc_sql() alone do not make a value safe in SQL."
refs = ["CVE-2025-7036"]

# Input written into prepare()'s format (not bound by it) is reported by
# php-sqli-string-concat, whose ->prepare( sink covers $wpdb->prepare too.
# $wpdb's queries are this rule's (php-sqli-string-concat leaves $wpdb out),
# except input that is only an ORDER BY identifier: prepare() cannot bind
# that, and php-sqli-orderby-identifier reports it.
[[args]]
unless_after = ["ORDER BY"]

[[samples]]
kind = "vulnerable"
note = "sanitize_text_field strips tags, not quotes"
code = '''
<?php
$uid = sanitize_text_field($_GET['id']);
$row = $wpdb->get_row("SELECT * FROM {$wpdb->prefix}answers WHERE user_id = $uid");
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
add_action('wp_ajax_find_items', function () {
    global $wpdb;
    $q = $_POST['search'];
    $items = $wpdb->get_results("SELECT * FROM {$wpdb->prefix}items WHERE title LIKE '%$q%'");
    wp_send_json($items);
});
'''

[[samples]]
kind = "safe"
code = '''
<?php
$row = $wpdb->get_row($wpdb->prepare(
    "SELECT * FROM {$wpdb->prefix}answers WHERE user_id = %d",
    $_GET['id']
));
'''

[[samples]]
kind = "safe"
code = '''
<?php
$like = '%' . $wpdb->esc_like($_POST['search']) . '%';
$items = $wpdb->get_results($wpdb->prepare("SELECT * FROM {$wpdb->prefix}items WHERE title LIKE %s", $like));
'''

[[samples]]
kind = "vulnerable"
note = "array_map with trim keeps each value as it came"
code = '''
<?php
$ids = array_map('trim', $_POST['ids']);
$wpdb->query("DELETE FROM {$wpdb->prefix}items WHERE id IN (" . implode(',', $ids) . ")");
'''

[[samples]]
kind = "safe"
note = "array_map with absint makes every value a number"
code = '''
<?php
$ids = array_map('absint', $_POST['ids']);
$wpdb->query("DELETE FROM {$wpdb->prefix}items WHERE id IN (" . implode(',', $ids) . ")");
'''

[[samples]]
kind = "vulnerable"
note = "extract makes $id from the shortcode attributes"
code = '''
<?php
extract(shortcode_atts(array('id' => 0, 'title' => ''), $_REQUEST));
$row = $wpdb->get_row("SELECT * FROM {$wpdb->prefix}items WHERE id = $id");
'''

[[samples]]
kind = "safe"
code = '''
<?php
extract(shortcode_atts(array('id' => 0, 'title' => ''), $_REQUEST));
$row = $wpdb->get_row("SELECT * FROM {$wpdb->prefix}items WHERE id = " . absint($id));
'''


[[samples]]
kind = "safe"
note = "the input is bound as a value, not written into the format"
code = '''
<?php
add_action('wp_ajax_drop_item', function () {
    global $wpdb;
    $wpdb->query($wpdb->prepare("DELETE FROM {$wpdb->prefix}items WHERE id = %d AND owner = %d", $_POST['id'], get_current_user_id()));
});
'''

[[samples]]
kind = "safe"
note = "the format gets one placeholder per value; count() is a number"
code = '''
<?php
add_action('wp_ajax_drop_items', function () {
    global $wpdb;
    $ids = array_map('absint', (array) $_POST['ids']);
    $marks = implode(',', array_fill(0, count($ids), '%d'));
    $wpdb->query($wpdb->prepare("DELETE FROM {$wpdb->prefix}items WHERE id IN ($marks)", $ids));
});
'''

[[samples]]
kind = "safe"
note = "sanitize_sql_orderby returns false unless the value is a column list with ASC or DESC"
code = '''
<?php
function list_rows() {
    global $wpdb;
    $sql = "SELECT * FROM {$wpdb->prefix}rows";
    if (!empty($_GET['orderby'])) {
        $sql .= ' ORDER BY ' . sanitize_sql_orderby($_GET['orderby'] . ' ' . $_GET['order']);
    }
    return $wpdb->get_results($wpdb->prepare($sql . ' LIMIT %d', 20));
}
'''

# filter_input(INPUT_GET, ...) and an application's filterInput(INPUT_POST, ...) wrapper read the request like $_GET and $_POST
[[source_args]]
sources = ["filter_input(", "->filterInput(", "->filter_input("]
arg = 1
values = ["INPUT_GET", "INPUT_POST", "INPUT_COOKIE"]
