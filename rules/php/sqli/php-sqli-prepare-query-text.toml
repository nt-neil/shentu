id = "php-sqli-prepare-query-text"
lang = "php"
class = "sqli"
cwe = "CWE-89"
severity = "high"
tier = "info"
title = "Request input written into the query text of a prepared statement"
frameworks = ["wordpress", "doctrine"]
sources = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "get_query_var", "->get_param(", "$request['", "shortcode_atts(", "$atts[", "$request->query->get(", "$request->request->get(", "$request->get(", "->get_json_params(", "->get_body_params(", "->get_query_params(", "$request->input(", "filter_input(", "->filterInput(", "->filter_input("]
# prepare() binds the values given later to execute() (PDO, mysqli) or after
# the format ($wpdb->prepare); input written into the statement or format
# itself is SQL. This rule alone reports it, on any receiver (a receiver the
# file says nothing about may be a database connection);
# php-sqli-string-concat reports the other query calls.
# Known false positive (kept over a miss): a placeholder list made by a
# callback that returns a constant, implode(',', array_map(fn($v) => '%d', $ids)),
# is still taken for input (engine, v0.2.6); array_fill(0, count($ids), '%d') is not.
sinks = ["->prepare(", "mysqli_prepare("]
sanitizers = ["absint", "intval", "(int)", "count(", "sizeof(", "sanitize_sql_orderby", "in_array", "->prepare("]
fix = "Only placeholders (%s, %d, ? or :name) may stand for values in the query text; pass the values as the following arguments, or to execute(), and map identifiers such as column names to a fixed allowlist."
refs = ["CVE-2026-109977", "CVE-2026-120558"]

# Input that is only an ORDER BY identifier is php-sqli-orderby-identifier's.
[[args]]
sinks = ["->prepare("]
arg = 1
unless_after = ["ORDER BY"]

[[args]]
sinks = ["mysqli_prepare("]
arg = 2
unless_after = ["ORDER BY"]

[[samples]]
kind = "vulnerable"
note = "prepare() only escapes the arguments after the query; the search term is already part of the query"
code = '''
<?php
add_action('wp_ajax_lookup_member', function () {
    global $wpdb;
    $term = sanitize_text_field(wp_unslash($_POST['term']));
    $sql = $wpdb->prepare("SELECT id FROM {$wpdb->prefix}members WHERE name LIKE '%$term%' AND status = %s", 'active');
    wp_send_json($wpdb->get_col($sql));
});
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
$stmt = $pdo->prepare('SELECT * FROM orders WHERE customer = ' . $_GET['customer']);
$stmt->execute();
'''

[[samples]]
kind = "safe"
code = '''
<?php
add_action('wp_ajax_lookup_member', function () {
    global $wpdb;
    $like = '%' . $wpdb->esc_like(wp_unslash($_POST['term'])) . '%';
    $sql = $wpdb->prepare("SELECT id FROM {$wpdb->prefix}members WHERE name LIKE %s AND status = %s", $like, 'active');
    wp_send_json($wpdb->get_col($sql));
});
'''

[[samples]]
kind = "safe"
code = '''
<?php
$stmt = $pdo->prepare('SELECT * FROM orders WHERE customer = ?');
$stmt->execute([$_GET['customer']]);
'''

[[samples]]
kind = "vulnerable"
note = "REST parameters read with array access are request input too"
code = '''
<?php
register_rest_route('shop/v1', '/carriers', ['methods' => 'GET', 'callback' => function ($request) {
    global $wpdb;
    $name = $request['carrier'];
    return $wpdb->get_results($wpdb->prepare("SELECT * FROM {$wpdb->prefix}carriers WHERE slug = '" . $name . "' AND active = %d", 1));
}]);
'''

[[samples]]
kind = "safe"
note = "a fragment that prepare() already filled in is parameterized SQL, not input"
code = '''
<?php
function my_plugin_count_events() {
    global $wpdb;
    $extra = '';
    if (isset($_GET['venue'])) {
        $extra .= $wpdb->prepare(' AND venue = %s', wp_unslash($_GET['venue']));
    }
    return (int) $wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$wpdb->prefix}events WHERE status = %s $extra", 'open'));
}
'''

[[samples]]
kind = "safe"
note = "the fix for a column name: an allowlist, since a placeholder cannot stand for an identifier"
code = '''
<?php
add_action('wp_ajax_sort_members', function () {
    global $wpdb;
    $col = sanitize_key(wp_unslash($_POST['col']));
    if (!in_array($col, ['name', 'joined', 'city'], true)) {
        $col = 'name';
    }
    wp_send_json($wpdb->get_results($wpdb->prepare("SELECT id, $col FROM {$wpdb->prefix}members WHERE status = %s", 'active')));
});
'''

[[samples]]
kind = "safe"
code = '''
<?php
$stmt = $pdo->prepare('SELECT id, email FROM users WHERE name = ?');
$stmt->execute([$_GET['name']]);
'''

[[samples]]
kind = "vulnerable"
note = "prepare does not help a value written into the statement it prepares"
code = '''
<?php
$stmt = $pdo->prepare("SELECT id, email FROM users WHERE name = '" . $_GET['name'] . "'");
$stmt->execute();
'''

[[samples]]
kind = "vulnerable"
note = "prepare binds only the values after the format: input written into the format is SQL"
code = '''
<?php
add_action('wp_ajax_drop_items', function () {
    global $wpdb;
    $wpdb->query($wpdb->prepare("DELETE FROM {$wpdb->prefix}items WHERE id IN ({$_POST['ids']}) AND owner = %d", get_current_user_id()));
});
'''

[[samples]]
kind = "safe"
note = "sizeof() is a number: one placeholder per value"
code = '''
<?php
add_action('wp_ajax_drop_items', function () {
    global $wpdb;
    $ids = array_map('absint', (array) $_POST['ids']);
    $marks = implode(',', array_fill(0, sizeof($ids), '%d'));
    $wpdb->query($wpdb->prepare("DELETE FROM {$wpdb->prefix}items WHERE id IN ($marks)", $ids));
});
'''

[[samples]]
kind = "vulnerable"
note = "a query var written into prepare()'s format"
code = '''
<?php
add_action('template_redirect', function () {
    global $wpdb;
    $slug = get_query_var('book');
    $row = $wpdb->get_row($wpdb->prepare("SELECT * FROM {$wpdb->prefix}books WHERE slug = '$slug' AND status = %s", 'live'));
});
'''

[[samples]]
kind = "safe"
code = '''
<?php
function shop_items($req) {
    global $wpdb;
    return $wpdb->get_results($wpdb->prepare("SELECT * FROM {$wpdb->prefix}items WHERE cat = %s LIMIT %d", $req->get_param('cat'), 10));
}
'''

# filter_input(INPUT_GET, ...) and an application's filterInput(INPUT_POST, ...) wrapper read the request like $_GET and $_POST
[[source_args]]
sources = ["filter_input(", "->filterInput(", "->filter_input("]
arg = 1
values = ["INPUT_GET", "INPUT_POST", "INPUT_COOKIE"]
