id = "php-code-eval-eval"
lang = "php"
class = "code-eval"
cwe = "CWE-94"
severity = "critical"
title = "eval, assert or create_function on request data"
sources = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "php://input", "$request->input("]
sinks = ["eval(", "assert(", "create_function(", "preg_replace_callback("]
sanitizers = []
fix = "Remove eval and do the same thing in ordinary code: decode input with json_decode or intval, check names against an allowlist, then assign directly (for example $object->{$name . 'Order'} = (int) $key). There is no safe way to escape code for eval."
refs = ["CVE-2017-9841", "CVE-2026-33479"]
text = ["php://input"]

# preg_replace_callback(pattern, callback, subject): input in the subject is
# only text being matched; code runs when the request names the callback.
[[args]]
sinks = ["preg_replace_callback("]
arg = 2
name = "callback"

[[samples]]
kind = "vulnerable"
code = '''
<?php
eval('?>' . file_get_contents('php://input'));
'''

[[samples]]
kind = "vulnerable"
note = "building an array literal for eval from request values"
code = '''
<?php
foreach ($_REQUEST['sections'] as $name => $ids) {
    eval('$order["' . $name . '"] = [' . $ids . '];');
}
'''

[[samples]]
kind = "safe"
code = '''
<?php
$order = [];
foreach ((array) ($_REQUEST['sections'] ?? []) as $name => $ids) {
    $order[(string) $name] = array_map('intval', explode(',', (string) $ids));
}
'''

[[samples]]
kind = "vulnerable"
note = "the request names the function called for every match"
code = '''
<?php
echo preg_replace_callback('/\w+/', $_GET['fn'], $text);
'''

[[samples]]
kind = "safe"
note = "a fixed callback; the input is only the text matched"
code = '''
<?php
$text = preg_replace_callback('/&#(\d+);/', 'decode_entity', $_POST['content']);
'''

[[samples]]
kind = "vulnerable"
note = "the callback passed by name, after the subject"
code = '''
<?php
echo preg_replace_callback(subject: $text, pattern: '/\w+/', callback: $_POST['fn']);
'''
