id = "php-ldapi-filter"
lang = "php"
class = "ldapi"
cwe = "CWE-90"
severity = "high"
tier = "info"
title = "Request input placed in an LDAP search filter without ldap_escape"
frameworks = ["wordpress", "laravel"]
sources = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "->get_param(", "$request->input(", "$request->get("]
sinks = ["ldap_search(", "ldap_list(", "ldap_read("]
sanitizers = ["ldap_escape", "ctype_alnum", "ctype_digit", "intval", "absint"]
fix = "Escape every value put into a filter with ldap_escape($value, '', LDAP_ESCAPE_FILTER)."
refs = ["CVE-2026-75007"]

[[args]]
arg = 3

[[samples]]
kind = "vulnerable"
code = '''
<?php
$user = $_POST['username'];
$sr = ldap_search($conn, 'ou=people,dc=example,dc=org', "(uid=$user)");
'''

[[samples]]
kind = "safe"
code = '''
<?php
$user = ldap_escape($_POST['username'], '', LDAP_ESCAPE_FILTER);
$sr = ldap_search($conn, 'ou=people,dc=example,dc=org', "(uid=$user)");
'''
