id = "php-cmdi-shell-exec"
lang = "php"
class = "cmdi"
cwe = "CWE-78"
severity = "critical"
title = "Request data (including headers) placed into a shell command"
frameworks = ["laravel"]
sources = ["$_GET", "$_POST", "$_REQUEST", "$_SERVER['HTTP_", "$request->input(", "$request->getHost()", "$request->header("]
sinks = ["exec(", "shell_exec(", "system(", "passthru(", "popen(", "proc_open(", "`", "mail("]
sanitizers = ["escapeshellarg"]
fix = "Avoid the shell: use a PHP function or an argument array (proc_open with an array, Symfony Process); if a shell is unavoidable, wrap every value in escapeshellarg(). mail()'s fifth argument is passed to sendmail's command line too, and escapeshellarg does not protect it there (mail() escapes it again): leave it out and set sendmail_from instead."
refs = ["CVE-2026-54182", "CVE-2016-10033"]

[[samples]]
kind = "vulnerable"
note = "the Host header is attacker-controlled"
code = '''
<?php
$host = $request->getHost();
exec("curl -s https://stats.example.com/ping?site=" . $host . " > /dev/null 2>&1 &");
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
$ip = $_GET['ip'];
echo shell_exec("ping -c 1 $ip");
'''

[[samples]]
kind = "vulnerable"
note = "the fifth argument of mail() goes onto the sendmail command line"
code = '''
<?php
$from = $_POST['from'];
mail('sales@example.com', 'Contact form', $_POST['message'], '', '-f' . $from);
'''

[[samples]]
kind = "vulnerable"
note = "mail() runs escapeshellcmd over the fifth argument, which undoes escapeshellarg's quoting"
code = '''
<?php
$from = filter_var($_POST['from'], FILTER_VALIDATE_EMAIL);
mail('sales@example.com', 'Contact form', $_POST['message'], '', '-f' . escapeshellarg($from));
'''

[[samples]]
kind = "safe"
code = '''
<?php
ini_set('sendmail_from', 'noreply@example.com');
mail('sales@example.com', 'Contact form', $_POST['message'], 'Reply-To: noreply@example.com');
'''

[[samples]]
kind = "safe"
code = '''
<?php
$ip = filter_var($_GET['ip'], FILTER_VALIDATE_IP);
if ($ip !== false) {
    echo shell_exec('ping -c 1 ' . escapeshellarg($ip));
}
'''
