id = "php-cmdi-shell-exec"
lang = "php"
class = "cmdi"
cwe = "CWE-78"
severity = "critical"
title = "Request data (including headers) placed into a shell command"
frameworks = ["laravel"]
sources = ["$_GET", "$_POST", "$_REQUEST", "$_SERVER['HTTP_", "$request->input(", "$request->getHost()", "$request->header("]
sinks = ["exec(", "shell_exec(", "system(", "passthru(", "popen(", "proc_open(", "`", "$this->process->execute(", "$this->process->executeAsync(", "Process::run(", "Process::start("]
sanitizers = ["escapeshellarg", "ProcessExecutor::escape("]
fix = "Avoid the shell: use a PHP function or an argument array (proc_open with an array, Symfony Process); if a shell is unavoidable, wrap every value in escapeshellarg()."
refs = ["CVE-2026-54182", "CVE-2021-29472"]

[[args]]
sinks = ["Process::run(", "Process::start("]
arg = 1
whole = true   # Laravel Process: a string runs through the shell, an array does not

[[samples]]
kind = "vulnerable"
note = "the Host header is attacker-controlled"
code = '''
<?php
$host = $request->getHost();
exec("curl -s https://stats.example.com/ping?site=" . $host . " > /dev/null 2>&1 &");
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
$ip = $_GET['ip'];
echo shell_exec("ping -c 1 $ip");
'''

[[samples]]
kind = "safe"
code = '''
<?php
$ip = filter_var($_GET['ip'], FILTER_VALIDATE_IP);
if ($ip !== false) {
    echo shell_exec('ping -c 1 ' . escapeshellarg($ip));
}
'''

[[samples]]
kind = "vulnerable"
note = "Composer's ProcessExecutor runs its first argument through a shell"
code = '''
<?php
class Hooks {
    public function tag() {
        $this->process->execute('git tag ' . $_POST['name'], $output);
    }
}
'''

[[samples]]
kind = "safe"
code = '''
<?php
class Hooks {
    public function tag() {
        $this->process->execute('git tag ' . ProcessExecutor::escape($_POST['name']), $output);
    }
}
'''

[[samples]]
kind = "vulnerable"
note = "a chained Laravel Process facade with a command string"
code = '''
<?php
$result = Process::timeout(30)->run('convert ' . $request->input('file') . ' out.png');
'''

[[samples]]
kind = "safe"
note = "an argument array is not read by a shell"
code = '''
<?php
$result = Process::path(storage_path('img'))->timeout(30)->run(['convert', $request->input('file'), 'out.png']);
'''
