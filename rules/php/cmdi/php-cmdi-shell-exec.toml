id = "php-cmdi-shell-exec"
lang = "php"
class = "cmdi"
cwe = "CWE-78"
severity = "critical"
title = "Request data (including headers) placed into a shell command"
frameworks = ["laravel"]
# Symfony's and WordPress's request readers too, which php-cmdi-process-shell-commandline
# took into Process::run( before leaving Laravel's Process to this rule.
# Laravel's request() helper (also request()->input(), whose receiver is the
# helper's result), $request->post( and ->all(, and the Request facade.
sources = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "$_FILES[*]['name']", "$_FILES[*]['type']", "$_SERVER['HTTP_", "$request->input(", "$request->query(", "$request->getHost()", "$request->header(",
           "$request->query->get(", "$request->attributes->get(", "$request->request->get(", "$request->get(", "$request->query->all(", "->get_param(",
           "request(", "$request->post(", "$request->all(", "Request::input(", "Request::query("]
sinks = ["exec(", "shell_exec(", "system(", "passthru(", "popen(", "proc_open(", "`", "$this->process->execute(", "$this->process->executeAsync(", "Process::run(", "Process::start("]
sanitizers = ["escapeshellarg", "ProcessExecutor::escape("]
fix = "Avoid the shell: use a PHP function or an argument array (proc_open with an array, Symfony Process); if a shell is unavoidable, wrap every value in escapeshellarg()."
refs = ["CVE-2026-54182", "CVE-2021-29472", "CVE-2026-107639"]

[[args]]
sinks = ["Process::run(", "Process::start("]
arg = 1
whole = true   # Laravel Process: a string runs through the shell, an array does not

[[samples]]
kind = "vulnerable"
note = "the Host header is attacker-controlled"
code = '''
<?php
$host = $request->getHost();
exec("curl -s https://stats.example.com/ping?site=" . $host . " > /dev/null 2>&1 &");
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
$ip = $_GET['ip'];
echo shell_exec("ping -c 1 $ip");
'''

[[samples]]
kind = "safe"
code = '''
<?php
$ip = filter_var($_GET['ip'], FILTER_VALIDATE_IP);
if ($ip !== false) {
    echo shell_exec('ping -c 1 ' . escapeshellarg($ip));
}
'''

[[samples]]
kind = "vulnerable"
note = "Composer's ProcessExecutor runs its first argument through a shell"
code = '''
<?php
class Hooks {
    public function tag() {
        $this->process->execute('git tag ' . $_POST['name'], $output);
    }
}
'''

[[samples]]
kind = "safe"
code = '''
<?php
class Hooks {
    public function tag() {
        $this->process->execute('git tag ' . ProcessExecutor::escape($_POST['name']), $output);
    }
}
'''

[[samples]]
kind = "vulnerable"
note = "a chained Laravel Process facade with a command string"
code = '''
<?php
$result = Process::timeout(30)->run('convert ' . $request->input('file') . ' out.png');
'''

[[samples]]
kind = "safe"
note = "an argument array is not read by a shell"
code = '''
<?php
$result = Process::path(storage_path('img'))->timeout(30)->run(['convert', $request->input('file'), 'out.png']);
'''

[[samples]]
kind = "vulnerable"
note = "escapeshellcmd() leaves spaces and leading dashes, so an uploaded name can add options to convert"
code = '''
<?php
$name = $_FILES['map']['name'];
move_uploaded_file($_FILES['map']['tmp_name'], '/srv/maps/' . basename($name));
exec(escapeshellcmd('convert /srv/maps/' . basename($name) . ' -resize 800x /srv/maps/preview.png'));
'''

[[samples]]
kind = "safe"
note = "the uploaded name is quoted as one argument; the temporary path PHP chose is not input"
code = '''
<?php
$up = $_FILES['map'];
exec('file -b --mime-type ' . $up['tmp_name']);
exec('convert ' . escapeshellarg('/srv/maps/' . basename($up['name'])) . ' -resize 800x /srv/maps/preview.png');
'''

[[samples]]
kind = "vulnerable"
note = "Laravel Process: a string runs through the shell"
code = '''
<?php
class PingController extends Controller
{
    public function ping(Request $request)
    {
        $result = Process::run('ping -c 1 ' . $request->input('host'));
        return $result->output();
    }
}
'''

[[samples]]
kind = "safe"
note = "Laravel Process: an argument array, which no shell parses"
code = '''
<?php
class PingController extends Controller
{
    public function ping(Request $request)
    {
        $result = Process::run(['ping', '-c', '1', $request->input('host')]);
        return $result->output();
    }
}
'''

[[samples]]
kind = "vulnerable"
note = "Laravel's request() helper"
code = '''
<?php
class BackupController extends Controller
{
    public function dump()
    {
        return shell_exec('pg_dump --table=' . request('table') . ' shop');
    }
}
'''

[[samples]]
kind = "safe"
note = "Laravel's request() helper, quoted as one argument"
code = '''
<?php
class BackupController extends Controller
{
    public function dump()
    {
        return shell_exec('pg_dump --table=' . escapeshellarg(request('table')) . ' shop');
    }
}
'''

[[samples]]
kind = "vulnerable"
note = "Laravel: $request->post() and the Request facade"
code = '''
<?php
class DeployController extends Controller
{
    public function checkout(Request $request)
    {
        exec('git -C /srv/app checkout ' . $request->post('branch'));
        exec('git -C /srv/app log -1 ' . Request::input('ref'));
    }
}
'''

[[samples]]
kind = "safe"
note = "Laravel: an argument array, which no shell parses"
code = '''
<?php
class DeployController extends Controller
{
    public function checkout(Request $request)
    {
        Process::run(['git', '-C', '/srv/app', 'checkout', '--', $request->post('branch')]);
    }
}
'''

[[samples]]
kind = "safe"
note = "request( is Laravel's helper only, not an HTTP client's ->request( method"
code = '''
<?php
class StatusController extends Controller
{
    public function report()
    {
        $code = $this->http->request('GET', 'https://status.example.com/v1')->getStatusCode();
        exec('logger -t status ' . $code);
    }
}
'''
