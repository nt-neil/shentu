id = "php-cmdi-mail-params"
lang = "php"
class = "cmdi"
cwe = "CWE-88"
severity = "critical"
title = "Request data in the fifth (additional_params) argument of mail()"
frameworks = ["laravel"]
sources = ["$_GET", "$_POST", "$_REQUEST", "$_SERVER['HTTP_", "$request->input(", "$request->getHost()", "$request->header("]
sinks = ["mail("]
sanitizers = []
fix = "Leave mail()'s fifth argument out (set sendmail_from in php.ini or with ini_set) or pass only a fixed value; escapeshellarg does not help here because mail() escapes the argument again."
refs = ["CVE-2016-10033"]

[[args]]
arg = 5   # the additional_params passed to sendmail

[[samples]]
kind = "vulnerable"
code = '''
<?php
$from = $_POST['from'];
mail('sales@example.com', 'Contact form', $_POST['message'], '', '-f' . $from);
'''

[[samples]]
kind = "vulnerable"
note = "mail() runs escapeshellcmd over the fifth argument, which undoes escapeshellarg's quoting"
code = '''
<?php
$from = filter_var($_POST['from'], FILTER_VALIDATE_EMAIL);
mail('sales@example.com', 'Contact form', $_POST['message'], '', '-f' . escapeshellarg($from));
'''

[[samples]]
kind = "vulnerable"
note = "the Host header is attacker-controlled"
code = '''
<?php
mail($to, $subject, $body, '', '-fnoreply@' . $request->getHost());
'''

[[samples]]
kind = "safe"
code = '''
<?php
ini_set('sendmail_from', 'noreply@example.com');
mail('sales@example.com', 'Contact form', $_POST['message'], 'Reply-To: noreply@example.com');
'''
