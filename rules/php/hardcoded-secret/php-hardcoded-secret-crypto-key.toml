id = "php-hardcoded-secret-crypto-key"
lang = "php"
class = "hardcoded-secret"
cwe = "CWE-321"
severity = "high"
tier = "info"
title = "Encryption key written in the code"
sources = []
sinks = ["openssl_encrypt(", "openssl_decrypt(", "sodium_crypto_secretbox(", "sodium_crypto_secretbox_open(", "sodium_crypto_aead_xchacha20poly1305_ietf_encrypt(", "sodium_crypto_aead_xchacha20poly1305_ietf_decrypt(", "sodium_crypto_aead_chacha20poly1305_ietf_encrypt(", "sodium_crypto_aead_chacha20poly1305_ietf_decrypt(", "sodium_crypto_aead_aes256gcm_encrypt(", "sodium_crypto_aead_aes256gcm_decrypt("]
sanitizers = []
fix = "Every installation of the code shares a key written in it: load the key from configuration or the environment (getenv(), a config file outside the web root, wp_salt() in WordPress), generate it per installation, and rotate it."
refs = ["CVE-2023-3404"]

[[args]]
sinks = ["openssl_encrypt(", "openssl_decrypt("]
arg = 3
literal = true

[[args]]
sinks = ["sodium_crypto_secretbox(", "sodium_crypto_secretbox_open("]
arg = 3
literal = true

[[samples]]
kind = "vulnerable"
code = '''
<?php
function my_plugin_seal($plain) {
    $iv = random_bytes(16);
    return base64_encode($iv . openssl_encrypt($plain, 'aes-256-cbc', '__SECRET__', OPENSSL_RAW_DATA, $iv));
}
'''

[[samples]]
kind = "safe"
note = "the fix: a key from the environment"
code = '''
<?php
function my_plugin_seal($plain) {
    $iv = random_bytes(16);
    return base64_encode($iv . openssl_encrypt($plain, 'aes-256-cbc', getenv('MY_PLUGIN_KEY'), OPENSSL_RAW_DATA, $iv));
}
'''

[[args]]
sinks = ["sodium_crypto_aead_xchacha20poly1305_ietf_encrypt(", "sodium_crypto_aead_xchacha20poly1305_ietf_decrypt(", "sodium_crypto_aead_chacha20poly1305_ietf_encrypt(", "sodium_crypto_aead_chacha20poly1305_ietf_decrypt(", "sodium_crypto_aead_aes256gcm_encrypt(", "sodium_crypto_aead_aes256gcm_decrypt("]
arg = 4
literal = true
