id = "php-hardcoded-secret-credentials"
lang = "php"
class = "hardcoded-secret"
cwe = "CWE-798"
severity = "medium"
tier = "info"
title = "Password or signing key written in the code"
frameworks = ["wordpress", "laravel"]
sources = []
sinks = ["mysqli_connect(", "mysqli(", "mysqli_real_connect(", "PDO(", "ldap_bind(", "ftp_login(", "ssh2_auth_password(", "JWT::encode(", "Key("]
sanitizers = []
fix = "Read credentials and keys from the environment or a configuration file outside the repository (getenv(), a constant set in wp-config.php, config() in Laravel), and rotate any value that was committed."
refs = ["CVE-2023-5318"]

[[args]]
sinks = ["mysqli_connect(", "mysqli(", "PDO(", "ldap_bind(", "ftp_login(", "ssh2_auth_password("]
arg = 3
literal = true

[[args]]
sinks = ["mysqli_real_connect("]
arg = 4
literal = true

[[args]]
sinks = ["JWT::encode("]
arg = 2
literal = true

[[args]]
sinks = ["Key("]
arg = 1
literal = true

[[samples]]
kind = "vulnerable"
code = '''
<?php
$db = new mysqli('localhost', 'shop', '__SECRET__', 'shop');
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
$jwt = JWT::encode($claims, '__SECRET__', 'HS256');
'''

[[samples]]
kind = "safe"
code = '''
<?php
$db = new mysqli(DB_HOST, DB_USER, getenv('DB_PASSWORD'), DB_NAME);
$jwt = JWT::encode($claims, $_ENV['JWT_SECRET'], 'HS256');
'''
