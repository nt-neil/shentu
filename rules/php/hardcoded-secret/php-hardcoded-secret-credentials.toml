id = "php-hardcoded-secret-credentials"
lang = "php"
class = "hardcoded-secret"
cwe = "CWE-798"
severity = "medium"
tier = "info"
title = "Password or signing key written in the code"
frameworks = ["wordpress", "laravel"]
sources = []
sinks = ["mysqli_connect(", "mysqli(", "mysqli_real_connect(", "PDO(", "ldap_bind(", "ftp_login(", "ssh2_auth_password(", "JWT::encode(", "Key(", "hash_hmac("]
sanitizers = []
fix = "Read credentials and keys from the environment or a configuration file outside the repository (getenv(), a constant set in wp-config.php, config() in Laravel), and rotate any value that was committed."
refs = ["CVE-2023-5318"]

[[args]]
sinks = ["mysqli_connect(", "mysqli(", "PDO(", "ldap_bind(", "ftp_login(", "ssh2_auth_password("]
arg = 3
literal = true

[[args]]
sinks = ["mysqli_real_connect("]
arg = 4
literal = true

[[args]]
sinks = ["JWT::encode("]
arg = 2
literal = true

[[args]]
sinks = ["Key("]
arg = 1
literal = true

# the key of an HMAC; a short label that only names the purpose ('wp-sha384',
# a domain separator) is not a secret
[[args]]
sinks = ["hash_hmac("]
arg = 3
literal = true
min_len = 8
exclude = ["^[a-z0-9_]+-(sha|md5)[0-9]*$"]

[[samples]]
kind = "vulnerable"
code = '''
<?php
$db = new mysqli('localhost', 'shop', '__SECRET__', 'shop');
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
$jwt = JWT::encode($claims, '__SECRET__', 'HS256');
'''

[[samples]]
kind = "safe"
code = '''
<?php
$db = new mysqli(DB_HOST, DB_USER, getenv('DB_PASSWORD'), DB_NAME);
$jwt = JWT::encode($claims, $_ENV['JWT_SECRET'], 'HS256');
'''

[[samples]]
kind = "vulnerable"
note = "a class constant of the same file"
code = '''
<?php
class Store {
    const DB_PASSWORD = '__SECRET__';
    public function connect() {
        return new PDO('mysql:host=localhost;dbname=shop', 'shop', self::DB_PASSWORD);
    }
}
'''

[[samples]]
kind = "vulnerable"
note = "a property declared with the key, and a key made from a written string"
code = '''
<?php
class Tokens {
    private $signingKey = '__SECRET__';
    public function issue($claims) {
        return JWT::encode($claims, $this->signingKey, 'HS256');
    }
    public function issueOther($claims) {
        $key = hash('sha256', '__SECRET__');
        return JWT::encode($claims, $key, 'HS256');
    }
}
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
$sig = hash_hmac('sha256', $payload, '__SECRET__');
'''

[[samples]]
kind = "safe"
note = "a purpose label as the HMAC key (WordPress password hashing), and keys read from configuration"
code = '''
<?php
$pre = base64_encode(hash_hmac('sha384', $password, 'wp-sha384', true));
$sig = hash_hmac('sha256', $payload, wp_salt('auth'));
class Tokens {
    private $signingKey = '';
    public function __construct() {
        $this->signingKey = getenv('JWT_KEY');
    }
    public function issue($claims) {
        $key = hash('sha256', getenv('APP_KEY'));
        return JWT::encode($claims, $this->signingKey, 'HS256') . JWT::encode($claims, $key, 'HS256');
    }
}
'''
