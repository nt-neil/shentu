id = "php-weak-crypto-password-hash"
lang = "php"
class = "weak-crypto"
cwe = "CWE-916"
severity = "high"
tier = "info"
title = "Password from the request hashed with a fast, unsalted hash"
frameworks = ["wordpress", "laravel"]
sources = ["$_POST['pass", "$_POST['pwd", "$_GET['pass", "$_REQUEST['pass", "$_REQUEST['pwd", "$request->input('pass", "$request->password"]
sinks = ["md5(", "sha1(", "hash(", "crypt("]
sanitizers = []
fix = "Hash passwords with password_hash() (or wp_hash_password() in WordPress) and check them with password_verify(); md5, sha1 and sha256 are fast and can be brute-forced."
refs = ["CVE-2017-7888"]

[[args]]
sinks = ["hash("]
when = ["'md5'", "'sha1'", "'sha256'", "'sha512'", "'crc32'"]

[[samples]]
kind = "vulnerable"
code = '''
<?php
$hash = md5($_POST['password']);
$wpdb->insert($table, ['user' => $login, 'pass' => $hash]);
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
$ok = hash('sha256', $_POST['pwd'] . $salt) === $row['pw'];
'''

[[samples]]
kind = "safe"
code = '''
<?php
$hash = password_hash($_POST['password'], PASSWORD_DEFAULT);
$etag = md5($_POST['content']);
'''
