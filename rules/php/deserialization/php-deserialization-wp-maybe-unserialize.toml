id = "php-deserialization-wp-maybe-unserialize"
lang = "php"
class = "deserialization"
cwe = "CWE-502"
severity = "critical"
tier = "info"
title = "maybe_unserialize() on data the client sends"
frameworks = ["wordpress"]
sources = ["$_GET", "$_FILES", "$request['", "shortcode_atts(", "$atts[", "$_POST", "$_REQUEST", "$_COOKIE", "$_SERVER['HTTP_", "php://input", "->get_param(", "->get_body(", "->get_json_params(", "->get_body_params(", "filter_input(", "->filterInput(", "->filter_input("]
sinks = ["maybe_unserialize("]
sanitizers = ["is_serialized_string("]   # a check: a serialized string unserializes to a string, never an object
text = ["php://input"]
fix = "maybe_unserialize() calls unserialize() on any string that looks serialized, so a client can send objects: exchange data with json_encode()/json_decode() instead."
refs = ["CVE-2024-3070", "CVE-2026-104764"]

[[samples]]
kind = "vulnerable"
code = '''
<?php
add_action('wp_ajax_nopriv_save_cart', function () {
    $cart = maybe_unserialize(wp_unslash($_POST['cart']));
    update_option('pending_cart', $cart);
});
'''

[[samples]]
kind = "vulnerable"
code = '''
<?php
register_rest_route('shop/v1', '/import', ['methods' => 'POST', 'callback' => function ($request) {
    $rows = maybe_unserialize(base64_decode($request->get_param('rows')));
    return count($rows);
}]);
'''

[[samples]]
kind = "safe"
code = '''
<?php
add_action('wp_ajax_nopriv_save_cart', function () {
    $cart = json_decode(wp_unslash($_POST['cart']), true);
    update_option('pending_cart', is_array($cart) ? $cart : []);
});
'''

# maybe_unserialize() unserializes strings only: an array (array(...), [...], explode()) is returned as is
[[args]]
sinks = ["maybe_unserialize("]
arg = 1
not_array = true

[[samples]]
kind = "safe"
code = '''
<?php
add_action('wp_ajax_save_form', function () {
    $form = array('fields' => $_POST['form_fields'], 'title' => $_POST['title']);
    $structure = maybe_unserialize($form);
    update_option('form_structure', $structure);
});
'''

# filter_input(INPUT_GET, ...) and an application's filterInput(INPUT_POST, ...) wrapper read the request like $_GET and $_POST
[[source_args]]
sources = ["filter_input(", "->filterInput(", "->filter_input("]
arg = 1
values = ["INPUT_GET", "INPUT_POST", "INPUT_COOKIE"]
