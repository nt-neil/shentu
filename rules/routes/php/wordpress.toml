# WordPress hands request data to plugin and theme functions through hooks.

[[route]]
id = "wp-shortcode"
lang = "php"
applies = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "$_SERVER", "$_FILES", "$request"]
framework = "wordpress"
title = "Shortcode attributes and content are written by any user who can edit a post"
register = ["add_shortcode"]
handler = 2
params = [1, 2]
note = "Contributors and up write [tag attr=\"...\"]content[/tag] in a post; the callback gets $atts and $content."
refs = ["https://developer.wordpress.org/reference/functions/add_shortcode/"]

[[route.samples]]
kind = "vulnerable"
code = '''<?php
add_shortcode('box', 'box_render');
function box_render($atts, $content = '') {
	global $wpdb;
	return $wpdb->get_var("SELECT title FROM {$wpdb->prefix}boxes WHERE slug = '" . $atts['slug'] . "'");
}
'''

[[route.samples]]
kind = "safe"
code = '''<?php
add_shortcode('box', 'box_render');
function box_render($atts, $content = '') {
	global $wpdb;
	return $wpdb->get_var($wpdb->prepare("SELECT title FROM {$wpdb->prefix}boxes WHERE slug = %s", $atts['slug']));
}
'''

[[route]]
id = "wp-rest-route"
lang = "php"
applies = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "$_SERVER", "$_FILES", "$request"]
framework = "wordpress"
title = "A REST route's callback gets the request ($request['id'], $request->get_param())"
register = ["register_rest_route"]
handler = 3
key = "callback"
params = [1]
refs = ["https://developer.wordpress.org/reference/functions/register_rest_route/"]

[[route.samples]]
kind = "vulnerable"
code = '''<?php
add_action('rest_api_init', function () {
	register_rest_route('shop/v1', '/item', array('methods' => 'GET', 'callback' => 'shop_item', 'permission_callback' => '__return_true'));
});
function shop_item($request) {
	global $wpdb;
	return $wpdb->get_results("SELECT * FROM {$wpdb->prefix}items WHERE id = " . $request['id']);
}
'''

[[route.samples]]
kind = "safe"
code = '''<?php
add_action('rest_api_init', function () {
	register_rest_route('shop/v1', '/item', array('methods' => 'GET', 'callback' => 'shop_item', 'permission_callback' => '__return_true'));
});
function shop_item($request) {
	global $wpdb;
	return $wpdb->get_results($wpdb->prepare("SELECT * FROM {$wpdb->prefix}items WHERE id = %d", $request['id']));
}
'''

[[route.samples]]
kind = "vulnerable"
note = "one array per method, as WordPress core and most plugins write it: each callback gets the request"
code = '''<?php
add_action('rest_api_init', function () {
	register_rest_route('shop/v1', '/item', array(
		array('methods' => 'GET', 'callback' => 'shop_item', 'permission_callback' => '__return_true'),
		array('methods' => 'DELETE', 'callback' => 'shop_drop', 'permission_callback' => '__return_true'),
	));
});
function shop_item($request) {
	return array();
}
function shop_drop($request) {
	global $wpdb;
	return $wpdb->query("DELETE FROM {$wpdb->prefix}items WHERE id = " . $request['id']);
}
'''

[[route]]
id = "wp-rest-permission"
lang = "php"
applies = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "$_SERVER", "$_FILES", "$request"]
framework = "wordpress"
title = "A REST route's permission_callback gets the request too, before the callback runs"
register = ["register_rest_route"]
handler = 3
key = "permission_callback"
params = [1]
refs = ["https://developer.wordpress.org/reference/functions/register_rest_route/"]

[[route.samples]]
kind = "vulnerable"
code = '''<?php
add_action('rest_api_init', function () {
	register_rest_route('shop/v1', '/item', array(
		array('methods' => 'GET', 'callback' => 'shop_item', 'permission_callback' => 'shop_can'),
	));
});
function shop_item($request) {
	return array();
}
function shop_can($request) {
	global $wpdb;
	return (bool) $wpdb->get_var("SELECT 1 FROM {$wpdb->prefix}keys WHERE k = '" . $request['key'] . "'");
}
'''

[[route.samples]]
kind = "safe"
code = '''<?php
add_action('rest_api_init', function () {
	register_rest_route('shop/v1', '/item', array('methods' => 'GET', 'callback' => 'shop_item', 'permission_callback' => 'shop_can'));
});
function shop_item($request) {
	return array();
}
function shop_can($request) {
	global $wpdb;
	return (bool) $wpdb->get_var($wpdb->prepare("SELECT 1 FROM {$wpdb->prefix}keys WHERE k = %s", $request['key']));
}
'''

[[route]]
id = "elementor-widget-settings"
lang = "php"
applies = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "$_SERVER", "$_FILES", "$request"]
framework = "wordpress"
title = "An Elementor widget's settings are written by any user who can edit with Elementor"
sources = ["->get_settings_for_display("]
in_classes = ["\\Elementor\\Widget_Base", "\\Elementor\\Core\\DynamicTags\\Tag", "\\Elementor\\Core\\DynamicTags\\Data_Tag"]
note = "Elementor widgets (render()), their skins ($this->parent->...), dynamic tags and hooks given an element ($element->...) read the controls with get_settings_for_display(); contributors and up set them. Elementor's own method, so on any object; on $this, only in a class extending Widget_Base or a dynamic tag's base."
refs = ["https://developers.elementor.com/docs/widgets/widget-rendering/"]

[[route.samples]]
kind = "vulnerable"
code = '''<?php
class Box_Widget extends \Elementor\Widget_Base {
	public function render() {
		global $wpdb;
		$s = $this->get_settings_for_display();
		echo $wpdb->get_var("SELECT name FROM {$wpdb->prefix}teams WHERE id = " . $s['team']);
	}
}
'''

[[route.samples]]
kind = "safe"
code = '''<?php
class Box_Widget extends \Elementor\Widget_Base {
	public function render() {
		global $wpdb;
		$s = $this->get_settings_for_display();
		echo $wpdb->get_var("SELECT name FROM {$wpdb->prefix}teams WHERE id = " . absint($s['team']));
	}
}
'''

[[route.samples]]
kind = "vulnerable"
note = "a skin reads its widget's settings through $this->parent"
code = '''<?php
class Skin_Box extends \Elementor\Skin_Base {
	public function render() {
		global $wpdb;
		$s = $this->parent->get_settings_for_display();
		echo $wpdb->get_var("SELECT name FROM {$wpdb->prefix}teams WHERE id = " . $s['team']);
	}
}
'''

[[route.samples]]
kind = "vulnerable"
note = "a hook given the element being rendered"
code = '''<?php
class Box_Hooks {
	public function before_render($element) {
		global $wpdb;
		$s = $element->get_settings_for_display();
		echo $wpdb->get_var("SELECT name FROM {$wpdb->prefix}teams WHERE id = " . $s['team']);
	}
}
'''

[[route]]
id = "elementor-widget-settings-raw"
lang = "php"
applies = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "$_SERVER", "$_FILES", "$request"]
framework = "wordpress"
title = "An Elementor widget's settings, read with get_settings(), are written by any user who can edit with Elementor"
sources = ["->get_settings("]
in_classes = ["\\Elementor\\Widget_Base", "\\Elementor\\Core\\DynamicTags\\Tag", "\\Elementor\\Core\\DynamicTags\\Data_Tag"]
this_only = true
note = "get_settings() without the _for_display: the same controls, as saved. WP_Widget, WooCommerce settings pages and other plugins' settings pages have a get_settings() too, and what it returns there is set by administrators (or is the page's own field list): so on $this only in a class extending Widget_Base or a dynamic tag's base, on a skin's $this->parent, and not on another object ($section->get_settings())."
refs = ["https://developers.elementor.com/docs/widgets/widget-rendering/"]

[[route.samples]]
kind = "vulnerable"
code = '''<?php
class Team_Widget extends \Elementor\Widget_Base {
	public function render() {
		global $wpdb;
		$s = $this->get_settings();
		echo $wpdb->get_var("SELECT name FROM {$wpdb->prefix}teams WHERE id = " . $s['team']);
	}
}
'''

[[route.samples]]
kind = "vulnerable"
note = "get_settings() in a widget whose own base class extends Widget_Base"
code = '''<?php
class Base_Widget extends \Elementor\Widget_Base {}
class Box_Widget extends Base_Widget {
	public function render() {
		global $wpdb;
		$s = $this->get_settings();
		echo $wpdb->get_var("SELECT name FROM {$wpdb->prefix}teams WHERE id = " . $s['team']);
	}
}
'''

[[route.samples]]
kind = "vulnerable"
note = "a dynamic tag's own settings"
code = '''<?php
class Team_Tag extends \Elementor\Core\DynamicTags\Tag {
	public function render() {
		global $wpdb;
		echo $wpdb->get_var("SELECT name FROM {$wpdb->prefix}teams WHERE id = " . $this->get_settings('team'));
	}
}
'''

[[route.samples]]
kind = "vulnerable"
note = "a skin's widget"
code = '''<?php
class Skin_Team extends \Elementor\Skin_Base {
	public function render() {
		global $wpdb;
		$s = $this->parent->get_settings();
		echo $wpdb->get_var("SELECT name FROM {$wpdb->prefix}teams WHERE id = " . $s['team']);
	}
}
'''

[[route.samples]]
kind = "safe"
note = "WP_Widget::get_settings() returns what an administrator saved for the widget"
code = '''<?php
class Box_Widget extends WP_Widget {
	public function widget($args, $instance) {
		global $wpdb;
		$all = $this->get_settings();
		echo $wpdb->get_var("SELECT name FROM {$wpdb->prefix}teams WHERE id = " . $all[$this->number]['team']);
	}
}
'''

[[route.samples]]
kind = "safe"
note = "a WooCommerce settings page's get_settings() returns what an administrator saved"
code = '''<?php
class Box_Settings extends WC_Settings_Page {
	public function output() {
		global $wpdb;
		$s = $this->get_settings();
		echo $wpdb->get_var("SELECT name FROM {$wpdb->prefix}teams WHERE id = " . $s['team']);
	}
}
'''

[[route.samples]]
kind = "safe"
note = "another object's get_settings(): a settings page's fields"
code = '''<?php
class Box_Admin {
	public function output($section) {
		global $wpdb;
		$s = $section->get_settings();
		echo $wpdb->get_var("SELECT name FROM {$wpdb->prefix}teams WHERE id = " . $s['team']);
	}
}
'''

[[route]]
id = "wp-stored-lookups"
lang = "php"
framework = "wordpress"
title = "An attachment's path and metadata, looked up by its id, are what WordPress stored, not the request's input"
clears = ["get_attached_file(", "wp_get_original_image_path(", "wp_get_attachment_metadata(", "get_post_mime_type(", "wp_get_attachment_url("]
clears_for = ["path-traversal", "deserialization"]
note = "A request may choose which attachment (its id); the file's path, URL, metadata and type were written by WordPress when the file was uploaded, so for a path or a phar:// wrapper they are no longer the request's input. Only for those classes: post meta, a comment or a user field may hold what an attacker wrote, and are not cleared."
refs = ["https://developer.wordpress.org/reference/functions/get_attached_file/"]

[[route.samples]]
kind = "vulnerable"
code = '''<?php
add_action('rest_api_init', function () {
	register_rest_route('media/v1', '/raw', array('methods' => 'GET', 'callback' => 'media_raw', 'permission_callback' => '__return_true'));
});
function media_raw($request) {
	return file_get_contents(WP_CONTENT_DIR . '/uploads/' . $request['file']);
}
'''

[[route.samples]]
kind = "safe"
code = '''<?php
add_action('rest_api_init', function () {
	register_rest_route('media/v1', '/raw', array('methods' => 'GET', 'callback' => 'media_raw', 'permission_callback' => '__return_true'));
});
function media_raw($request) {
	return file_get_contents(get_attached_file($request['id']));
}
'''

[[route]]
id = "wp-attachment-local-path"
lang = "php"
framework = "wordpress"
applies = ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "$_SERVER", "$_FILES", "$request"]
title = "An attachment's file path, looked up by its id, is a local file WordPress wrote: no URL to fetch"
clears = ["get_attached_file(", "wp_get_original_image_path("]
clears_for = ["ssrf"]
note = "Only the local paths: an attachment's URL (wp_get_attachment_url) may be rewritten by a plugin to another host (offloaded media), so fetching it stays an SSRF finding."

[[route.samples]]
kind = "vulnerable"
code = '''<?php
function fetch_media() {
	return wp_remote_get(wp_get_attachment_url($_GET['id']));
}
'''

[[route.samples]]
kind = "safe"
code = '''<?php
function fetch_media() {
	return file_get_contents(get_attached_file($_GET['id']));
}
'''
