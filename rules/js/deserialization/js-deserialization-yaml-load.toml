id = "js-deserialization-yaml-load"
lang = "js"
class = "deserialization"
cwe = "CWE-502"
severity = "high"
title = "js-yaml 3.x load() (or a full schema) on untrusted YAML"
frameworks = ["express", "koa", "fastify", "hapi"]
sources = ["req.body", "req.file", "req.files", "ctx.request.body", "request.body", "request.payload"]
sinks = ["yaml.load(", "yaml.loadAll(", "yaml.safeLoad(", "yaml.safeLoadAll("]
sanitizers = []
fix = "Upgrade to js-yaml 4 (load is safe by default) or call safeLoad on 3.x; never pass DEFAULT_FULL_SCHEMA for untrusted input."
refs = ["CVE-2013-4660"]

[[args]]
sinks = ["yaml.load(", "yaml.loadAll("]
unless = ["schema: yaml.FAILSAFE_SCHEMA", "schema: yaml.JSON_SCHEMA", "schema: FAILSAFE_SCHEMA", "schema: JSON_SCHEMA"]   # schemas without the js/* types

[[args]]
sinks = ["yaml.safeLoad(", "yaml.safeLoadAll("]
when = ["DEFAULT_FULL_SCHEMA"]   # safeLoad given the full schema is load

[[samples]]
kind = "vulnerable"
note = "js-yaml 3.x: !!js/function tags become callable code"
code = '''
app.post("/pipeline", express.text(), (req, res) => {
  const spec = yaml.load(req.body, { schema: yaml.DEFAULT_FULL_SCHEMA });
  res.json({ steps: spec.steps.length });
});
'''

[[samples]]
kind = "safe"
code = '''
app.post("/pipeline", express.text(), (req, res) => {
  const spec = yaml.safeLoad(req.body);
  res.json({ steps: spec.steps.length });
});
'''
