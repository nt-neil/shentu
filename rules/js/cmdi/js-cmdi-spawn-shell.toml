id = "js-cmdi-spawn-shell"
lang = "js"
class = "cmdi"
cwe = "CWE-78"
severity = "critical"
title = "spawn/execFile with shell: true on a command line that includes untrusted values"
frameworks = ["express", "nestjs", "nextjs", "koa", "fastify", "hapi"]
sources = ["req.query", "req.body", "req.params", "process.env", "@Query(", "@Body(", "@Param(", "@Req(", "req.originalUrl", "^request.nextUrl", "^req.nextUrl", "^request.url", "^req.url", "^searchParams", "^request.json(", "^req.json(", "^request.text(", "^req.text(", "^request.formData(", "^req.formData(", "^formData.get(", "ctx.query", "ctx.request.query", "request.query", "ctx.request.body", "request.body", "request.payload", "ctx.params", "request.params"]
sinks = ["spawn(", "spawnSync(", "execFile(", "execFileSync(", ".spawn(", ".spawnSync(", ".execFile(", ".execFileSync("]
sanitizers = []
fix = "Drop shell: true and pass the program and each value as separate arguments; shell: true turns the joined arguments back into a shell command line."
refs = ["CVE-2026-119282"]

[[args]]
when = ["shell:"]   # an argument array is passed as is; shell: with any value but a literal false joins it into a shell command line

[[samples]]
kind = "vulnerable"
code = '''
app.post("/build", (req, res) => {
  const child = spawn("gradle", ["build", `-Pflavor=${req.body.flavor}`], { shell: true });
  child.on("close", (code) => res.json({ code }));
});
'''

[[samples]]
kind = "safe"
code = '''
app.post("/build", (req, res) => {
  const child = spawn("gradle", ["build", `-Pflavor=${String(req.body.flavor)}`]);
  child.on("close", (code) => res.json({ code }));
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
code = '''
@Controller("build")
export class BuildController {
  @Post()
  build(@Query("flavor") flavor: string): void {
    spawn("gradle", ["build", `-Pflavor=${flavor}`], { shell: true });
  }
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
@Controller("build")
export class BuildController {
  @Post()
  build(@Query("flavor") flavor: string): void {
    spawn("gradle", ["build", `-Pflavor=${flavor}`]);
  }
}
'''
