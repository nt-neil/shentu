id = "js-cmdi-spawn-shell"
lang = "js"
class = "cmdi"
cwe = "CWE-78"
severity = "critical"
title = "spawn/execFile with shell: true on a command line that includes untrusted values"
frameworks = ["express", "nestjs", "nextjs"]
sources = ["req.query", "req.body", "req.params", "@Query(", "@Body(", "@Param(", "@Req(", "req.originalUrl", "^request.nextUrl", "^req.nextUrl", "^request.url", "^req.url", "^searchParams", "^request.json(", "^req.json(", "^request.formData(", "^req.formData(", "^formData.get("]
sinks = ["spawn(", "spawnSync(", "execFile(", "execFileSync(", ".spawn(", ".spawnSync(", ".execFile(", ".execFileSync("]
sanitizers = []
fix = "Drop shell: true and pass the program and each value as separate arguments; shell: true turns the joined arguments back into a shell command line."
refs = ["CVE-2026-119282"]

# an argument array is passed as is; shell: with any value but a literal false joins it into a shell
# command line: the command (1) and its arguments (2), not the options (cwd, env) beside shell:
[[args]]
when = ["shell:"]
arg = 1

[[args]]
when = ["shell:"]
arg = 2

[[samples]]
kind = "vulnerable"
code = '''
app.post("/build", (req, res) => {
  const child = spawn("gradle", ["build", `-Pflavor=${req.body.flavor}`], { shell: true });
  child.on("close", (code) => res.json({ code }));
});
'''

[[samples]]
kind = "safe"
code = '''
app.post("/build", (req, res) => {
  const child = spawn("gradle", ["build", `-Pflavor=${String(req.body.flavor)}`]);
  child.on("close", (code) => res.json({ code }));
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
code = '''
@Controller("build")
export class BuildController {
  @Post()
  build(@Query("flavor") flavor: string): void {
    spawn("gradle", ["build", `-Pflavor=${flavor}`], { shell: true });
  }
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
@Controller("build")
export class BuildController {
  @Post()
  build(@Query("flavor") flavor: string): void {
    spawn("gradle", ["build", `-Pflavor=${flavor}`]);
  }
}
'''

[[samples]]
kind = "safe"
note = "a fixed command and arguments; the server's own environment is no input"
code = '''
app.post("/rebuild", (req, res) => {
  const child = spawn("npm", ["run", "build"], { shell: true, env: process.env });
  child.on("close", (code) => res.json({ code }));
});
'''
