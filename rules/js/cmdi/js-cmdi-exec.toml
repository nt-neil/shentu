id = "js-cmdi-exec"
lang = "js"
class = "cmdi"
cwe = "CWE-78"
severity = "critical"
title = "Untrusted value placed into a command string run by exec/execSync"
frameworks = ["express", "nestjs", "nextjs"]
sources = ["req.query", "req.body", "req.params", "req.headers", "req.file", "originalname", "@Body(", "@Query(", "@Param(", "@Req(", "request.nextUrl", "req.nextUrl", "request.url", "request.json(", "req.json(", "request.formData(", "req.formData(", "searchParams"]
sinks = ["exec(", "execSync(", ".execSync(", "child_process.exec(", "childProcess.exec(", "cp.exec(", "require('child_process').exec(", "shell.exec("]
sanitizers = ["execFile(", "execFileSync(", "spawn("]
fix = "Use execFile or spawn with an argument array (no shell) so the value is one argument; never build a command string from input."
refs = ["CVE-2026-110644", "CVE-2026-59960"]

[[samples]]
kind = "vulnerable"
code = '''
app.post("/convert", upload.single("audio"), (req, res) => {
  exec(`ffmpeg -i "${req.file.path}" -ar 16000 "/tmp/out/${req.file.originalname}.wav"`, (err) => {
    res.sendStatus(err ? 500 : 204);
  });
});
'''

[[samples]]
kind = "vulnerable"
code = '''
app.get("/lookup", (req, res) => {
  const out = execSync("nslookup " + req.query.host).toString();
  res.type("text").send(out);
});
'''

[[samples]]
kind = "safe"
code = '''
app.get("/lookup", (req, res) => {
  execFile("nslookup", ["--", String(req.query.host)], (err, stdout) => {
    res.type("text").send(err ? "lookup failed" : stdout);
  });
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
code = '''
class PingDto { readonly host!: string }

@Controller("tools")
export class ToolsController {
  @Post("ping")
  ping(@Body() dto: PingDto): Promise<string> {
    return new Promise((resolve) => exec(`ping -c 1 ${dto.host}`, (_e, out) => resolve(out)));
  }
}
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
code = '''
export async function POST(req: NextRequest) {
  const data = await req.formData();
  const name = data.get("name") as string | null;
  const out = execSync("convert upload.png " + name!).toString();
  return new Response(out);
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
@Controller("tools")
export class ToolsController {
  @Get("lookup")
  lookup(@Query("host") host: string) {
    execFile("nslookup", ["--", String(host)], (_e: Error | null, out: string) => console.log(out));
  }
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
export async function POST(req: NextRequest) {
  const data = await req.formData();
  const out = execFileSync("convert", ["upload.png", String(data.get("name"))]).toString();
  return new Response(out);
}
'''
