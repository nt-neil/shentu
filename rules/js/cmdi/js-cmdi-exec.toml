[[samples]]
kind = "vulnerable"
note = "REF shape (CVE-2019-25158): the posted form fields are joined into a command line by a helper, then run with exec"
code = '''
const { exec } = require("child_process");
function speakCommand(f) {
  return "espeak -v " + f.voice + " -s " + f.speed + ' "' + f.text + '"';
}
app.post("/say", (req, res) => {
  const line = speakCommand(req.body);
  exec(line, (err) => res.sendStatus(err ? 500 : 204));
});
'''

[[samples]]
kind = "safe"
note = "as the fix says: execFile with an argument array, no shell"
code = '''
const { execFile } = require("child_process");
function speakArgs(f) {
  return ["-v", String(f.voice), "-s", String(f.speed), String(f.text)];
}
app.post("/say", (req, res) => {
  execFile("espeak", speakArgs(req.body), (err) => res.sendStatus(err ? 500 : 204));
});
'''
