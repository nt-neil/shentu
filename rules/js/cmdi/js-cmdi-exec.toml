id = "js-cmdi-exec"
lang = "js"
class = "cmdi"
cwe = "CWE-78"
severity = "critical"
title = "Untrusted value placed into a command string run by exec/execSync"
frameworks = ["express", "nestjs", "nextjs", "koa", "fastify", "hapi"]
sources = ["req.query", "req.body", "req.params", "req.headers", "req.file", "originalname", "@Query(", "@Body(", "@Param(", "@Headers(", "@Req(", "req.originalUrl", "^request.nextUrl", "^req.nextUrl", "^request.url", "^req.url", "^searchParams", "^request.json(", "^req.json(", "^request.text(", "^req.text(", "^request.formData(", "^req.formData(", "^formData.get(", "req.get(", "req.header(", "^headers().get(", "ctx.query", "ctx.request.query", "request.query", "ctx.request.body", "request.body", "request.payload", "ctx.params", "request.params", "ctx.headers", "request.headers", "ctx.request.header", "ctx.request.headers", "ctx.get("]
sinks = ["exec(", "execSync(", ".execSync(", "child_process.exec(", "childProcess.exec(", "cp.exec(", "require('child_process').exec(", "shell.exec("]
sanitizers = ["execFile(", "execFileSync(", "spawn("]
fix = "Use execFile or spawn with an argument array (no shell) so the value is one argument; never build a command string from input."
refs = ["CVE-2026-110644", "CVE-2026-59960", "CVE-2019-25158"]

[[samples]]
kind = "vulnerable"
code = '''
app.post("/convert", upload.single("audio"), (req, res) => {
  exec(`ffmpeg -i "${req.file.path}" -ar 16000 "/tmp/out/${req.file.originalname}.wav"`, (err) => {
    res.sendStatus(err ? 500 : 204);
  });
});
'''

[[samples]]
kind = "vulnerable"
code = '''
app.get("/lookup", (req, res) => {
  const out = execSync("nslookup " + req.query.host).toString();
  res.type("text").send(out);
});
'''

[[samples]]
kind = "safe"
code = '''
app.get("/lookup", (req, res) => {
  execFile("nslookup", ["--", String(req.query.host)], (err, stdout) => {
    res.type("text").send(err ? "lookup failed" : stdout);
  });
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
code = '''
class PingDto { readonly host!: string }

@Controller("tools")
export class ToolsController {
  @Post("ping")
  ping(@Body() dto: PingDto): Promise<string> {
    return new Promise((resolve) => exec(`ping -c 1 ${dto.host}`, (_e, out) => resolve(out)));
  }
}
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
code = '''
export async function POST(req: NextRequest) {
  const data = await req.formData();
  const name = data.get("name") as string | null;
  const out = execSync("convert upload.png " + name!).toString();
  return new Response(out);
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
@Controller("tools")
export class ToolsController {
  @Get("lookup")
  lookup(@Query("host") host: string) {
    execFile("nslookup", ["--", String(host)], (_e: Error | null, out: string) => console.log(out));
  }
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
export async function POST(req: NextRequest) {
  const data = await req.formData();
  const out = execFileSync("convert", ["upload.png", String(data.get("name"))]).toString();
  return new Response(out);
}
'''

[[samples]]
kind = "vulnerable"
note = "exec imported under another name, and execSync on require('node:child_process')"
code = '''
const { exec: run } = require("child_process");
app.post("/ping", (req, res) => {
  run("ping -c 1 " + req.body.host, () => res.end());
  require("node:child_process").execSync("nslookup " + req.body.host);
});
'''

[[samples]]
kind = "safe"
note = "re.exec is a regular expression method, not child_process"
code = '''
const { execFile: run } = require("child_process");
const HOST = /^[a-z0-9.-]+$/;
app.post("/ping", (req, res) => {
  const m = HOST.exec(req.body.host);
  run("ping", ["-c", "1", "--", String(req.body.host)], () => res.end());
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "NestJS: @Headers() reads a request header"
code = '''
@Controller("tools")
export class ToolsController {
  @Get("trace")
  trace(@Headers("x-target") target: string) {
    exec(`traceroute ${target}`);
  }
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
@Controller("tools")
export class ToolsController {
  @Get("trace")
  trace(@Headers("x-target") target: string) {
    execFile("traceroute", ["--", target]);
  }
}
'''

[[samples]]
kind = "vulnerable"
note = "req.get() and req.header() read request headers"
code = '''
app.get("/trace", (req, res) => {
  exec("traceroute " + req.get("x-target"));
  execSync("ping -c 1 " + req.header("x-host"));
});
'''

[[samples]]
kind = "safe"
code = '''
app.get("/trace", (req, res) => {
  execFile("traceroute", ["--", String(req.get("x-target"))]);
  execFileSync("ping", ["-c", "1", "--", String(req.header("x-host"))]);
});
'''

