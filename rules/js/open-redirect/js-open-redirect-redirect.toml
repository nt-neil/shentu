id = "js-open-redirect-redirect"
lang = "js"
class = "open-redirect"
cwe = "CWE-601"
severity = "medium"
tier = "info"
title = "Redirect to a URL taken from the request"
frameworks = ["express", "koa", "fastify", "hapi"]
sources = ["req.query", "req.body", "req.params", "ctx.query", "ctx.request.query", "request.query", "ctx.request.body", "request.body", "request.payload", "ctx.params", "request.params"]
sinks = ["res.redirect(", "res.location(", "res.writeHead(", "res.setHeader("]
sanitizers = ["encodeURIComponent(", ".startsWith("]
fix = "Redirect only to a host or path in an allowlist (parse it with new URL() and compare the origin); a prefix check (startsWith('/') without '//' or '/\\\\') can be bypassed with a tab or newline ('/\\t/evil.example'), so it does not make the target safe."
refs = ["CVE-2022-2237"]

[[args]]
sinks = ["res.redirect(", "res.location("]
leading = true

[[args]]
sinks = ["res.writeHead("]
arg = 2
key = "Location"
leading = true

[[args]]
sinks = ["res.setHeader("]
arg = 2
when = ["'Location'", "'location'"]
leading = true

[[samples]]
kind = "vulnerable"
code = '''
app.post("/login", (req, res) => {
  login(req);
  res.redirect(req.query.returnTo || "/");
});
'''

[[samples]]
kind = "vulnerable"
code = '''
app.get("/out", (req, res) => {
  const { url } = req.query;
  res.redirect(302, url);
});
'''

[[samples]]
kind = "safe"
code = '''
app.post("/login", (req, res) => {
  login(req);
  res.redirect("/welcome?from=" + encodeURIComponent(req.query.returnTo));
});
'''

[[samples]]
kind = "safe"
code = '''
const PAGES = ["/", "/account", "/orders"];
app.get("/out", (req, res) => {
  const { url } = req.query;
  if (!PAGES.includes(url)) return res.redirect("/");
  res.redirect(302, url);
});
'''

[[samples]]
kind = "vulnerable"
note = "a leading / is not enough: //evil.example leaves the site"
code = '''
app.get('/after', (req, res) => {
  const next = String(req.query.next);
  if (next.startsWith('/')) return res.redirect(next);
  res.redirect('/');
});
'''

[[samples]]
kind = "vulnerable"
note = "excluding // and /\\ is not enough: the browser drops a tab or newline, so /\\t/evil.example becomes //evil.example"
code = '''
app.get('/after', (req, res) => {
  const next = String(req.query.next);
  if (next.startsWith('/') && !next.startsWith('//') && !next.startsWith('/\\')) return res.redirect(next);
  res.redirect('/');
});
'''

[[samples]]
kind = "vulnerable"
note = "Node http: the Location header in writeHead"
code = '''
http.createServer((req, res) => {
  const url = new URL(req.url, 'http://localhost');
  res.writeHead(302, { Location: req.query.next });
  res.end();
});
'''

[[samples]]
kind = "safe"
note = "a fixed path first: the value cannot leave the site"
code = '''
app.get('/go', (req, res) => {
  res.writeHead(302, { Location: '/fixed/' + encodeURIComponent(req.query.page), 'Cache-Control': req.query.cc });
  res.end();
});
'''

[[samples]]
kind = "safe"
note = "as the fix says: a fixed path first, the value encoded after it"
code = '''
app.get("/orders/:id/view", (req, res) => {
  res.redirect("/account/orders/" + encodeURIComponent(req.params.id));
});
'''
