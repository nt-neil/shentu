  }
}
'''

[[samples]]
kind = "safe"
note = "ApostropheCMS: launder.string() turns any body value into a string"
code = '''
async function resumeJob(req) {
  const jobId = self.apos.launder.string(req.body.jobId);
  return jobs.findOne({ _id: jobId });
}
'''

[[samples]]
kind = "safe"
note = "a query value only picks the subtype of a BSON Binary built by the server"
code = '''
app.get("/doc/:id", async (req, res) => {
  const key = new mongodb.Binary(Buffer.from(req.params.id, "base64"), Number(req.query.subtype) === 4 ? 4 : 3);
  res.json(await docs.findOne({ _id: key }));
});
'''

[[samples]]
kind = "vulnerable"
note = "MongoDB options (sort, limit) beside the filter do not make it safe"
code = '''
app.get("/posts", async (req, res) => {
  res.json(await db.collection("posts").find({ author: req.query.author }, { sort: { at: -1 }, limit: 10 }).toArray());
});
'''

[[samples]]
kind = "vulnerable"
note = "a field named relations in the options (here a projection) is no TypeORM call"
code = '''
app.get("/people", async (req, res) => {
  res.json(await db.collection("people").find({ name: req.query.name }, { projection: { relations: 1 } }).toArray());
});
'''
