id = "js-nosqli-mongo-query"
lang = "js"
class = "nosqli"
cwe = "CWE-943"
severity = "high"
tier = "info"
title = "Request data placed in a MongoDB query without forcing it to a string"
frameworks = ["express", "nestjs", "nextjs", "koa", "fastify", "hapi"]
sources = ["req.body", "req.query", "@Query(", "@Body(", "@Req(", "^request.json(", "^req.json(", "ctx.query", "ctx.request.query", "request.query", "ctx.request.body", "request.body", "request.payload"]
route_members = ["query", "body"]
sinks = [".findOne(", ".find(", ".findOneAndUpdate(", ".findOneAndDelete(", ".updateOne(", ".updateMany(", ".deleteOne(", ".deleteMany(", ".countDocuments(", ".exists(", "$where"]
sanitizers = ["String(", ".toString(", "mongoSanitize(", "sanitize(", "parseInt(", "ObjectId(", "ObjectID(", "Binary(", "mongodb.Binary(", "bson.Binary(", "BSON.Binary(", "typeof", ".launder.string(", ".launder.strings(", ".launder.id(", ".launder.ids(", ".launder.integer(", ".launder.float(", ".launder.boolean("]   # BSON constructors make a value, not an operator object; ApostropheCMS launder returns scalars
fix = "Convert each value to the type the field holds (String(), Number()) or reject non-strings (typeof x !== \"string\") before it goes into the filter; enable sanitizeFilter in Mongoose; never build $where from input."
refs = ["GHSA-f5cv-xrv9-r8w7"]

[[args]]
sinks = [".findOne(", ".find(", ".findOneAndUpdate(", ".findOneAndDelete(", ".updateOne(", ".updateMany(", ".deleteOne(", ".deleteMany(", ".countDocuments(", ".exists("]
arg = 1

[[samples]]
kind = "vulnerable"
note = "a JSON body {\"password\": {\"$ne\": \"\"}} matches any password"
code = '''
app.post("/login", async (req, res) => {
  const user = await User.findOne({ username: req.body.username, password: req.body.password });
  res.json({ ok: !!user });
});
'''

[[samples]]
kind = "vulnerable"
code = '''
app.get("/posts", async (req, res) => {
  res.json(await db.collection("posts").find({ $where: "this.author == '" + req.query.author + "'" }).toArray());
});
'''

[[samples]]
kind = "safe"
code = '''
app.post("/login", async (req, res) => {
  const user = await User.findOne({ username: String(req.body.username) });
  const item = items.find((i) => i.id === req.body.id);
  res.json({ ok: !!user && !!item });
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "NestJS: a JSON body value can be an operator object"
code = '''
@Controller("session")
export class SessionController {
  constructor(@InjectModel("User") private users: Model<User>) {}
  @Post()
  async login(@Body() dto: LoginDto) {
    return this.users.findOne({ email: dto.email, password: dto.password });
  }
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
@Controller("session")
export class SessionController {
  constructor(@InjectModel("User") private users: Model<User>) {}
  @Post()
