id = "js-sqli-raw-interpolation"
lang = "js"
class = "sqli"
cwe = "CWE-89"
severity = "high"
title = "Request input concatenated or interpolated into SQL for a driver or knex.raw"
frameworks = ["express", "nestjs", "nextjs"]
sources = ["req.query", "req.body", "req.params", "req.cookies", "@Query(", "@Body(", "@Param(", "@Req(", "req.originalUrl", "^request.nextUrl", "^req.nextUrl", "^request.url", "^req.url", "^searchParams", "^request.json(", "^req.json(", "^request.formData(", "^req.formData(", "^formData.get(", "^cookies().get("]
sinks = [".query(", ".execute(", "knex.raw(", ".raw(", ".whereRaw(", ".orderByRaw("]
sanitizers = ["parseInt(", "Number("]
fix = "Use placeholders and pass values separately (query('... WHERE id = ?', [id]), knex.raw('?? = ?', [col, val])); never build SQL with + or template literals."
refs = ["CVE-2026-47384"]

[[args]]
arg = 1   # the SQL text; values in the bindings array are safe
whole = true   # query({ sql: "... ?", args: [input] }) binds the input; only SQL text built from input is the attack

[[samples]]
kind = "vulnerable"
code = '''
app.get("/users", async (req, res) => {
  const [rows] = await pool.query("SELECT id, email FROM users WHERE name = '" + req.query.name + "'");
  res.json(rows);
});
'''

[[samples]]
kind = "vulnerable"
code = '''
router.post("/group", async (req, res) => {
  const col = req.body.column;
  const rows = await knex("orders").select(knex.raw(`count(*) as n, ${col}`)).groupByRaw(col);
  res.json(rows);
});
'''

[[samples]]
kind = "safe"
code = '''
app.get("/users", async (req, res) => {
  const [rows] = await pool.query("SELECT id, email FROM users WHERE name = ?", [req.query.name]);
  res.json(rows);
});
'''

[[samples]]
kind = "safe"
note = "?? binds an identifier, and the column is checked against an allowlist first"
code = '''
const COLUMNS = new Set(["status", "country"]);
router.post("/group", async (req, res) => {
  const col = COLUMNS.has(req.body.column) ? req.body.column : "status";
  const rows = await knex("orders").select(knex.raw("count(*) as n, ??", [col])).groupBy(col);
  res.json(rows);
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "NestJS: @Body() binds the request body to the parameter"
code = '''
interface CreateUserDto { name: string; email?: string }

@Controller("users")
export class UsersController {
  constructor(private readonly ds: DataSource) {}

  @Post()
  async create(@Body() dto: CreateUserDto): Promise<void> {
    await this.ds.query(`INSERT INTO users (name) VALUES ('${dto.name}')`);
  }
}
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "Next.js route handler: the query string of request.nextUrl"
code = '''
export async function GET(request: NextRequest): Promise<Response> {
  const q = request.nextUrl.searchParams.get("q")!;
  const [rows] = (await pool.query(`SELECT id FROM posts WHERE title LIKE '%${q}%'`)) as [RowDataPacket[], FieldPacket[]];
  return Response.json(rows);
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
note = "ParseIntPipe turns the route parameter into a number"
code = '''
@Controller("users")
export class UsersController {
  constructor(private readonly ds: DataSource) {}

  @Get(":id")
  findOne(@Param("id", ParseIntPipe) id: number) {
    return this.ds.query(`SELECT * FROM users WHERE id = ${id}`);
  }
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
export async function GET(request: NextRequest) {
  const q = request.nextUrl.searchParams.get("q") ?? "";
  const [rows] = await pool.query<RowDataPacket[]>("SELECT id FROM posts WHERE title LIKE ?", [`%${q}%`]);
  return Response.json(rows satisfies RowDataPacket[]);
}
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "Next.js: cookies() from next/headers"
code = '''
export async function GET() {
  const team = cookies().get("team")?.value;
  return Response.json(await pool.query(`SELECT * FROM boards WHERE team = '${team}'`));
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
export async function GET() {
