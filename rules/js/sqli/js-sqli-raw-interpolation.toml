[[samples]]
kind = "safe"
dialect = "ts"
note = "libsql / mysql2 object form: the input is bound by args (or values), not part of the SQL text"
code = '''
export async function addTodo(formData: FormData) {
  "use server";
  await db.execute({ sql: "INSERT INTO todos (description) VALUES (?)", args: [formData.get("description") as string] });
}
'''

[[samples]]
kind = "vulnerable"
note = "Koa: ctx.query and ctx.params"
code = '''
router.get("/users/:org", async (ctx) => {
  const [rows] = await pool.query(`SELECT * FROM users WHERE org = '${ctx.params.org}' AND name LIKE '%${ctx.query.q}%'`);
  ctx.body = rows;
});
'''

