[[samples]]
kind = "safe"
note = "execute() of a script VM and of a looked-up tool: no SQL"
code = '''
router.post("/script", async (ctx) => {
  const { script } = ctx.request.body;
  const vm = new IsolatedVM();
  ctx.body = vm.execute(wrap(script));
});
fastify.post("/tools/:name", async (request) => {
  const tool = tools.find((t) => t.name === request.params.name);
  return tool.execute(JSON.parse(request.body.input));
});
'''
