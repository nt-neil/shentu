[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "Next.js Server Action: the form data comes from the client"
code = '''
export async function rename(formData: FormData) {
  "use server";
  await pool.query(`UPDATE boards SET name = '${formData.get("name")}' WHERE id = 1`);
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
export async function rename(formData: FormData) {
