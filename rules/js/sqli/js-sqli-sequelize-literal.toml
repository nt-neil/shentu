id = "js-sqli-sequelize-literal"
lang = "js"
class = "sqli"
cwe = "CWE-89"
severity = "high"
title = "Request input placed into Sequelize.literal or a raw sequelize.query string"
frameworks = ["express", "nestjs", "nextjs"]
sources = ["req.query", "req.body", "req.params", "@Query(", "@Body(", "@Param(", "@Req(", "req.originalUrl", "^request.nextUrl", "^req.nextUrl", "^request.url", "^req.url", "^searchParams", "^request.json(", "^req.json(", "^request.formData(", "^req.formData(", "^formData.get("]
sinks = ["Sequelize.literal(", "sequelize.literal(", "sequelize.query(", "Sequelize.fn("]
sanitizers = ["sequelize.escape("]
fix = "Keep literal() for constant SQL only; pass values with the replacements or bind options of sequelize.query, or use operator objects ({ [Op.lt]: value })."
refs = ["CVE-2026-52887"]

[[args]]
sinks = ["sequelize.query("]
arg = 1   # the SQL text; replacements and bind values are safe

[[samples]]
kind = "vulnerable"
code = '''
router.get("/messages", async (req, res) => {
  const before = req.query.before;
  const rows = await Message.findAll({
    where: Sequelize.literal(`"createdAt" < '${before}'`),
  });
  res.json(rows);
});
'''

[[samples]]
kind = "vulnerable"
note = "Sequelize.where does not clean a literal built from input"
code = '''
router.get("/messages", async (req, res) => {
  const rows = await Message.findAll({
    where: Sequelize.where(Sequelize.literal(`date_trunc('day', "createdAt") < '${req.query.before}'`), true),
  });
  res.json(rows);
});
'''

[[samples]]
kind = "safe"
code = '''
router.get("/messages", async (req, res) => {
  const rows = await Message.findAll({
    where: { createdAt: { [Op.lt]: new Date(String(req.query.before)) } },
  });
  res.json(rows);
});
'''

[[samples]]
kind = "safe"
code = '''
router.get("/search", async (req, res) => {
  const rows = await sequelize.query("SELECT * FROM items WHERE title = :t", {
    replacements: { t: String(req.query.t) },
    type: QueryTypes.SELECT,
  });
  res.json(rows);
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
code = '''
@Controller("messages")
export class MessagesController {
  @Get(":day")
  list(@Param("day") day: string) {
    return Message.findAll({ where: Sequelize.literal(`date("createdAt") = '${day}'`) });
  }
}
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "Next.js: a form field from request.formData()"
code = '''
export async function POST(request: Request) {
  const form = await request.formData();
  const tag = form.get("tag") as string;
  const rows = await sequelize.query(`SELECT * FROM items WHERE tag = '${tag}'`);
  return Response.json(rows);
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
export async function POST(request: Request) {
  const form = await request.formData();
  const rows = await sequelize.query("SELECT * FROM items WHERE tag = :tag", {
    replacements: { tag: String(form.get("tag")) },
    type: QueryTypes.SELECT,
  });
  return Response.json(rows);
}
'''
