id = "js-sqli-sequelize-literal"
lang = "js"
class = "sqli"
cwe = "CWE-89"
severity = "high"
title = "Request input placed into Sequelize.literal or a raw sequelize.query string"
frameworks = ["express", "nestjs", "nextjs", "koa", "fastify", "hapi"]
sources = ["req.query", "req.body", "req.params", "@Query(", "@Body(", "@Param(", "@Req(", "@Request(", "req.originalUrl", "^request.nextUrl", "^req.nextUrl", "^request.url", "^req.url", "^searchParams", "^request.json(", "^req.json(", "^request.text(", "^req.text(", "^request.formData(", "^req.formData(", "^formData.get(", "ctx.query", "ctx.request.query", "request.query", "ctx.request.body", "request.body", "request.payload", "ctx.params", "request.params"]
# SQL text into sequelize.query() is js-sqli-raw-interpolation's
sinks = ["Sequelize.literal(", "sequelize.literal(", "Sequelize.fn("]
sanitizers = ["sequelize.escape("]
fix = "Keep literal() for constant SQL only; pass values with the replacements or bind options of sequelize.query, or use operator objects ({ [Op.lt]: value })."
refs = ["CVE-2026-52887"]

[[samples]]
kind = "vulnerable"
code = '''
router.get("/messages", async (req, res) => {
  const before = req.query.before;
  const rows = await Message.findAll({
    where: Sequelize.literal(`"createdAt" < '${before}'`),
  });
  res.json(rows);
});
'''

[[samples]]
kind = "vulnerable"
note = "Sequelize.where does not clean a literal built from input"
code = '''
router.get("/messages", async (req, res) => {
  const rows = await Message.findAll({
    where: Sequelize.where(Sequelize.literal(`date_trunc('day', "createdAt") < '${req.query.before}'`), true),
  });
  res.json(rows);
});
'''

[[samples]]
kind = "safe"
code = '''
router.get("/messages", async (req, res) => {
  const rows = await Message.findAll({
    where: { createdAt: { [Op.lt]: new Date(String(req.query.before)) } },
  });
  res.json(rows);
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
code = '''
@Controller("messages")
export class MessagesController {
  @Get(":day")
  list(@Param("day") day: string) {
    return Message.findAll({ where: Sequelize.literal(`date("createdAt") = '${day}'`) });
  }
}
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "NestJS's @Request() is @Req() by another name, whatever the parameter is called"
code = '''
@Controller()
export class AppController {
  @Get("messages")
  async list(@Request() r: Request) {
    return Message.findAll({ where: Sequelize.literal(`"createdAt" < '${r.query.before}'`) });
  }
}
'''
