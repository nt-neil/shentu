[[samples]]
kind = "safe"
note = "path.join normalizes, and the result must start with the base plus a separator"
code = '''
const REPORTS = "/var/app/reports";
app.get("/report/:name", (req, res) => {
  const file = path.join(REPORTS, req.params.name);
  if (!file.startsWith(REPORTS + path.sep)) return res.sendStatus(404);
  res.sendFile(file);
});
'''

[[samples]]
kind = "safe"
dialect = "ts"
note = "a path whose relative form from the base starts with .. leaves the base"
code = '''
const STORE = "/var/lib/app/store";
function storedFile(key: string): string {
  const file = path.join(STORE, key);
  if (path.relative(STORE, file).startsWith("..")) throw new Error("outside the store");
  return file;
}
app.get("/blob/:key", (req: Request, res: Response) => {
  const file = path.join(STORE, req.params.key);
  if (path.relative(STORE, file).startsWith("..")) throw new Error("outside the store");
  res.download(file);
});
'''

[[samples]]
kind = "safe"
note = "the relative path kept in a variable, checked for .. and ../"
code = '''
const MEDIA = path.resolve("media");
app.get("/media", (req, res) => {
  const target = path.resolve(MEDIA, String(req.query.p));
  const rel = path.relative(MEDIA, target);
  if (rel === ".." || rel.startsWith(".." + path.sep)) return res.status(403).end();
  fs.createReadStream(target).pipe(res);
});
'''

