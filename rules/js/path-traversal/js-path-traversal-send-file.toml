[[samples]]
kind = "vulnerable"
note = "readFileSync as a member of fs and of require('fs')"
code = '''
import fs from "fs";
app.get("/raw", (req, res) => {
  const a = fs.readFileSync(path.join(DOCS, req.query.a));
  const b = require("node:fs").readFileSync("/srv/docs/" + req.query.b);
  res.send(Buffer.concat([a, b]));
});
'''

