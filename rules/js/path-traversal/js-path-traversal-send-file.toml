id = "js-path-traversal-send-file"
lang = "js"
class = "path-traversal"
cwe = "CWE-22"
severity = "high"
title = "Request value joined into a path that is read, written or sent"
frameworks = ["express", "nestjs", "nextjs"]
sources = ["req.query", "req.params", "req.body", "@Query(", "@Body(", "@Param(", "@Req(", "request.nextUrl", "req.nextUrl", "request.url", "searchParams", "request.json(", "req.json(", "request.formData(", "req.formData("]
sinks = ["res.sendFile(", "res.download(", "fs.readFile(", "fs.createReadStream(", "fs.writeFile(", "fs.unlink(", "readFileSync("]
sanitizers = ["path.basename(", ".startsWith("]
fix = "Use res.sendFile(name, { root }) or resolve the path and require it to start with the base directory plus path.sep before touching the file."
refs = ["CVE-2014-6394"]

[[args]]
sinks = ["res.sendFile(", "res.download("]
arg = 1
unless = ["root:"]   # with a root, Express rejects paths that leave it

[[args]]
sinks = ["fs.readFile(", "fs.createReadStream(", "fs.writeFile(", "fs.unlink(", "readFileSync("]
arg = 1

[[samples]]
kind = "vulnerable"
note = "path.join normalizes ../ instead of rejecting it"
code = '''
app.get("/files/:name", (req, res) => {
  res.sendFile(path.join(__dirname, "uploads", req.params.name));
});
'''

[[samples]]
kind = "vulnerable"
code = '''
app.get("/log", (req, res) => {
  fs.createReadStream("/var/app/logs/" + req.query.file).pipe(res);
});
'''

[[samples]]
kind = "safe"
code = '''
app.get("/files/:name", (req, res) => {
  res.sendFile(req.params.name, { root: path.join(__dirname, "uploads"), dotfiles: "deny" });
});
'''

[[samples]]
kind = "safe"
code = '''
const LOGS = path.resolve("/var/app/logs") + path.sep;
app.get("/log", (req, res) => {
  const p = path.resolve(LOGS, String(req.query.file));
  if (!p.startsWith(LOGS)) return res.sendStatus(400);
  fs.createReadStream(p).pipe(res);
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
code = '''
@Controller("files")
export class FilesController {
  @Get(":name")
  get(@Param("name") name: string, @Res() res: Response): void {
    res.sendFile(path.join(UPLOADS, name));
  }
}
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "Next.js: new URL(request.url).searchParams"
code = '''
export async function GET(request: Request) {
  const { searchParams } = new URL(request.url);
  const file = searchParams.get("file") ?? "";
  return new Response(fs.createReadStream(path.join(LOGS, file)) as unknown as ReadableStream);
}
'''

[[samples]]
kind = "vulnerable"
dialect = "tsx"
note = "Next.js page: searchParams is a prop"
code = '''
export default async function Page({ searchParams }: { searchParams: Promise<{ doc?: string }> }) {
  const { doc } = await searchParams;
  const text = await new Promise<string>((ok) => fs.readFile(`/srv/docs/${doc}`, "utf8", (_e, d) => ok(d)));
  return <pre>{text}</pre>;
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
@Controller("files")
export class FilesController {
  @Get(":name")
  get(@Param("name") name: string, @Res() res: Response): void {
    res.sendFile(path.basename(name), { root: UPLOADS });
  }
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
export async function GET(req: NextRequest) {
  const file = path.basename(req.nextUrl.searchParams.get("file") ?? "");
  return new Response(fs.createReadStream(path.join(LOGS, file)) as unknown as ReadableStream);
}
'''

[[samples]]
kind = "safe"
dialect = "tsx"
code = '''
export default async function Page({ searchParams }: { searchParams: Promise<{ doc?: string }> }) {
  const { doc } = await searchParams;
  const name = path.basename(String(doc));
  const text = await new Promise<string>((ok) => fs.readFile(`/srv/docs/${name}`, "utf8", (_e, d) => ok(d)));
  return <pre>{text}</pre>;
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
note = "the name is checked against a fixed list"
code = '''
const DOCS = new Set<string>(["terms.pdf", "privacy.pdf"]);
export async function GET(request: Request) {
  const name = new URL(request.url).searchParams.get("doc") ?? "";
  if (!DOCS.has(name)) return new Response(null, { status: 404 });
  return new Response(fs.createReadStream(path.join(DOCS_DIR, name)) as unknown as ReadableStream);
}
'''
