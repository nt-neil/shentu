id = "js-ssrf-host-header"
lang = "js"
class = "ssrf"
cwe = "CWE-918"
severity = "high"
tier = "info"
title = "Server builds a URL from the request's Host header and fetches it"
frameworks = ["express", "koa", "fastify", "hapi"]
sources = ["req.get('host')", "req.get('x-forwarded-host')", "req.header('host')", "req.header('x-forwarded-host')", "req.hostname", "req.host", "req.headers.host", "req.headers['host']", "req.headers['x-forwarded-host']", "ctx.host", "ctx.hostname", "ctx.request.host", "ctx.request.hostname", "ctx.get('host')", "request.hostname", "request.headers.host", "request.headers['x-forwarded-host']", "request.info.host"]
sinks = ["fetch(", "axios(", "axios.get(", "axios.post(", "got(", "got.get(", "http.get(", "https.get(", "http.request(", "https.request(", "needle(", "superagent.get("]
sanitizers = ["encodeURIComponent("]   # an encoded value in the path or query of a fixed URL does not choose the host
fix = "Build server-side URLs from a configured base URL (or a fixed internal address), never from the Host or X-Forwarded-Host header, which the client chooses."
refs = ["CVE-2026-53607"]

[[args]]
arg = 1   # the URL; a Host value sent as a header (an option) is not the destination

[[samples]]
kind = "vulnerable"
note = "the client picks the host the server then calls, with the server's network position"
code = '''
app.get("/thumb/:id", async (req, res) => {
  const base = req.protocol + "://" + req.get('host');
  const r = await fetch(`${base}/internal/images/${encodeURIComponent(req.params.id)}`);
  res.type("png").send(Buffer.from(await r.arrayBuffer()));
});
'''

[[samples]]
kind = "vulnerable"
code = '''
router.post("/render", async (req, res) => {
  const origin = "https://" + req.headers['x-forwarded-host'];
  const page = await axios.get(origin + "/preview");
  res.send(page.data);
});
'''

[[samples]]
kind = "safe"
code = '''
const BASE_URL = process.env.BASE_URL || "http://127.0.0.1:3000";
app.get("/thumb/:id", async (req, res) => {
  const r = await fetch(`${BASE_URL}/internal/images/${encodeURIComponent(req.params.id)}`);
  res.type("png").send(Buffer.from(await r.arrayBuffer()));
});
'''

[[samples]]
kind = "safe"
note = "the Host header only decides between two fixed origins"
code = '''
app.get("/home", async (req, res) => {
  const origin = req.hostname === "eu.example.com" ? "https://api-eu.example.com" : "https://api.example.com";
  const r = await fetch(origin + "/status");
  res.json(await r.json());
});
'''
