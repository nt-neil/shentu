id = "js-ssrf-host-header"
lang = "js"
class = "ssrf"
cwe = "CWE-918"
severity = "high"
tier = "info"
title = "Server builds a URL from the request's Host header and fetches it"
frameworks = ["express", "koa", "fastify", "hapi"]
route_input = false   # a route's req.query or ctx.params is not the Host header: only the sources below count
# ...and, of a route handler's request whatever its parameter is called
# ((r, s) => r.headers.host), the two headers js-ssrf-http-request leaves to
# this rule with route_not.
route_only = ["headers.host", "headers.x-forwarded-host"]
# A header read by its name is this rule's only for Host and X-Forwarded-Host
# (source_args), in any case; js-ssrf-http-request takes every other name from
# the same sources, so a line is reported by one of the two. A whole headers
# object (h = req.headers, NestJS's @Headers() h) gives its host and
# x-forwarded-host members (sourcenot.go). NestJS's @Req() r and @Request() r
# are a handler's request: of them only r.headers.host and
# r.headers['x-forwarded-host'] (route_only, sourcenot.go nestReq). A handler's
# request by another name reads these sources as req's or ctx's (reqalias.go):
# r.hostname, r.get('host'), c.request.header.host, ({ headers }) => headers.host.
sources = ["req.get(", "req.header(", "req.hostname", "req.host", "req.headers.host", "req.headers[", "ctx.host", "ctx.hostname", "ctx.request.host", "ctx.request.hostname", "ctx.get(", "ctx.request.get(", "ctx.headers.host", "ctx.header.host", "ctx.request.header.host", "ctx.request.headers.host", "ctx.headers[", "ctx.header[", "ctx.request.header[", "ctx.request.headers[", "request.hostname", "request.headers.host", "request.headers[", "request.headers.get(", "request.info.host", "@Headers(", "@Req(", "@Request(", "^headers().get("]
source_args = [{ sources = ["req.get(", "req.header(", "req.headers[", "ctx.get(", "ctx.request.get(", "ctx.headers[", "ctx.header[", "ctx.request.header[", "ctx.request.headers[", "request.headers[", "request.headers.get(", "@Headers(", "@Req(", "@Request(", "^headers().get("], arg = 1, values = ["host", "x-forwarded-host"] }]
sinks = ["fetch(", "axios(", "axios.get(", "axios.post(", "axios.put(", "axios.delete(", "axios.head(", "got(", "got.get(", "got.post(", "http.get(", "https.get(", "http.request(", "https.request(", "needle(", "superagent.get("]
sanitizers = ["encodeURIComponent("]   # an encoded value in the path or query of a fixed URL does not choose the host
fix = "Build server-side URLs from a configured base URL (or a fixed internal address), never from the Host or X-Forwarded-Host header, which the client chooses."
refs = ["CVE-2026-53607"]

[[args]]
arg = 1   # the URL; a Host value sent as a header (an option) is not the destination

[[samples]]
kind = "vulnerable"
note = "the client picks the host the server then calls, with the server's network position"
code = '''
app.get("/thumb/:id", async (req, res) => {
  const base = req.protocol + "://" + req.get('host');
  const r = await fetch(`${base}/internal/images/${encodeURIComponent(req.params.id)}`);
  res.type("png").send(Buffer.from(await r.arrayBuffer()));
});
'''

[[samples]]
kind = "vulnerable"
code = '''
router.post("/render", async (req, res) => {
  const origin = "https://" + req.headers['x-forwarded-host'];
  const page = await axios.get(origin + "/preview");
  res.send(page.data);
});
'''

[[samples]]
kind = "safe"
code = '''
const BASE_URL = process.env.BASE_URL || "http://127.0.0.1:3000";
app.get("/thumb/:id", async (req, res) => {
  const r = await fetch(`${BASE_URL}/internal/images/${encodeURIComponent(req.params.id)}`);
  res.type("png").send(Buffer.from(await r.arrayBuffer()));
});
'''

[[samples]]
kind = "safe"
note = "the Host header only decides between two fixed origins"
code = '''
app.get("/home", async (req, res) => {
  const origin = req.hostname === "eu.example.com" ? "https://api-eu.example.com" : "https://api.example.com";
  const r = await fetch(origin + "/status");
  res.json(await r.json());
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "a Fetch API request: Host read by its name (js-ssrf-http-request leaves it to this rule)"
code = '''
export async function GET(request: Request) {
  const r = await fetch(`https://${request.headers.get("host")}/health`);
  return new Response(await r.text());
}
'''
