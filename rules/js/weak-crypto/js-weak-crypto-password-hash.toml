id = "js-weak-crypto-password-hash"
lang = "js"
class = "weak-crypto"
cwe = "CWE-916"
severity = "high"
tier = "info"
title = "Password from the request hashed with a fast, unsalted hash"
frameworks = ["express"]
sources = ["req.body.password", "req.body.pass", "req.body.passwd", "req.body.pwd", "req.query.password"]
sinks = ["crypto.createHash('md5').update(", "crypto.createHash('sha1').update(", "crypto.createHash('sha256').update(", "crypto.createHash('sha512').update(", "createHash('md5').update(", "createHash('sha1').update(", "createHash('sha256').update(", "md5(", "sha1("]
sanitizers = []
fix = "Hash passwords with a password hashing function (bcrypt, argon2, or crypto.scrypt with a random salt) and compare with its verify call; md5, sha1 and sha256 are fast and can be brute-forced."
refs = ["CVE-2026-110104"]

[[samples]]
kind = "vulnerable"
code = '''
app.post("/signup", async (req, res) => {
  const hash = crypto.createHash('md5').update(req.body.password).digest("hex");
  await users.insert({ name: req.body.name, hash });
  res.sendStatus(201);
});
'''

[[samples]]
kind = "safe"
code = '''
app.post("/signup", async (req, res) => {
  const hash = await bcrypt.hash(req.body.password, 12);
  const etag = crypto.createHash("md5").update(req.body.name).digest("hex");
  await users.insert({ name: req.body.name, hash, etag });
  res.sendStatus(201);
});
'''
