id = "js-hardcoded-secret-credentials"
lang = "js"
class = "hardcoded-secret"
cwe = "CWE-798"
severity = "medium"
tier = "info"
title = "Password or signing key written in the code"
frameworks = ["express"]
sources = []
sinks = ["jwt.sign(", "jwt.verify(", "crypto.createHmac(", "createHmac(", "mysql.createConnection(", "mysql.createPool(", "mysql2.createConnection(", "new Pool(", "new Client(", "new Sequelize("]
sanitizers = []
fix = "Read credentials and keys from the environment or a secrets store (process.env), and rotate any value that was committed."
refs = ["CVE-2026-49352"]

[[args]]
sinks = ["jwt.sign(", "jwt.verify(", "crypto.createHmac(", "createHmac("]
arg = 2
literal = true

[[args]]
sinks = ["mysql.createConnection(", "mysql.createPool(", "mysql2.createConnection(", "new Pool(", "new Client("]
when = ["password:"]
literal = true

[[args]]
sinks = ["new Sequelize("]
arg = 3
literal = true

[[samples]]
kind = "vulnerable"
code = '''
const token = jwt.sign({ sub: user.id }, "__SECRET__", { expiresIn: "1h" });
'''

[[samples]]
kind = "vulnerable"
code = '''
const pool = mysql.createPool({ host: "db", user: "app", password: "__SECRET__", database: "app" });
'''

[[samples]]
kind = "safe"
code = '''
const token = jwt.sign({ sub: user.id }, process.env.JWT_SECRET, { expiresIn: "1h" });
const pool = mysql.createPool({ host: "db", user: "app", password: process.env.DB_PASSWORD, database: "app" });
'''
