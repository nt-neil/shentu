id = "js-xss-response-url"
lang = "js"
class = "xss"
cwe = "CWE-79"
severity = "medium"
tier = "info"
title = "Request value sent back as a link URL or inside a script"
frameworks = ["express", "nestjs", "nextjs", "koa", "fastify", "hapi"]
sources = ["req.query", "req.params", "req.body", "req.cookies", "req.headers", "@Query(", "@Body(", "@Param(", "@Headers(", "^request.nextUrl", "^req.nextUrl", "^searchParams", "^request.json(", "^req.json(", "^request.text(", "^req.text(", "^request.formData(", "^req.formData(", "^formData.get(", "req.get(", "req.header(", "^headers().get(", "^cookies().get(", "ctx.query", "ctx.request.query", "request.query", "ctx.request.body", "request.body", "request.payload", "ctx.params", "request.params", "ctx.headers", "ctx.cookies.get(", "request.headers", "ctx.request.header", "ctx.request.headers", "ctx.get("]
sinks = ["res.send(", "res.write(", "res.end("]
sanitizers = ["encodeURIComponent(", "serialize(", "jsesc("]
fix = "In an href or src accept only http(s) URLs (new URL(value) and a protocol check) or encode the value with encodeURIComponent() after a fixed path; inside <script> serialize it with a script-safe encoder, not with HTML escaping."
refs = ["CVE-2024-43796"]

[[args]]
context = ["url", "js"]

[[samples]]
kind = "vulnerable"
note = "escapeHtml keeps a javascript: URL"
code = '''
app.get("/continue", (req, res) => {
  res.send('<a href="' + escapeHtml(req.query.next) + '">Continue</a>');
});
'''

[[samples]]
kind = "vulnerable"
code = '''
app.get("/widget", (req, res) => {
  res.send(`<script>var theme = "${req.query.theme}";</script>`);
});
'''

[[samples]]
kind = "safe"
code = '''
app.get("/continue", (req, res) => {
  res.send('<a href="/start?next=' + encodeURIComponent(req.query.next) + '">Continue</a>');
});
'''

[[samples]]
kind = "safe"
code = '''
app.get("/widget", (req, res) => {
  res.send(`<script>var theme = ${serialize(req.query.theme)};</script>`);
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "NestJS: a query value as a link"
code = '''
@Controller("go")
export class GoController {
  @Get()
  link(@Query("to") to: string, @Res() res: Response) {
    res.send(`<a href="${to}">continue</a>`);
  }
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
@Controller("go")
export class GoController {
  @Get()
  link(@Query("to") to: string, @Res() res: Response) {
    res.send(`<a href="/out?to=${encodeURIComponent(to)}">continue</a>`);
  }
}
'''
