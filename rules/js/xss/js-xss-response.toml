id = "js-xss-response"
lang = "js"
class = "xss"
cwe = "CWE-79"
severity = "medium"
tier = "info"
title = "Request value sent back in an HTML response without escaping"
frameworks = ["express", "nestjs", "nextjs", "koa", "fastify", "hapi"]
# Headers by name in brackets (user-agent), the referrer and the origin, in each
# framework's spelling (as js-ssrf-http-request): req.headers.host is the
# host-header rules' input, and a header read by name is not Host or
# Content-Type, which a cross-site page cannot set (see source_args)
sources = ["req.query", "req.params", "req.body", "req.cookies", "req.headers[", "req.headers.referer", "req.headers.referrer", "req.headers.origin",
           "ctx.headers.referer", "ctx.headers.origin", "ctx.request.header.referer", "ctx.request.header.origin",
           "ctx.request.headers.referer", "ctx.request.headers.origin", "request.headers.referer", "request.headers.referrer", "request.headers.origin", "request.headers.get(", "@Query(", "@Body(", "@Param(", "@Headers(", "^request.nextUrl", "^req.nextUrl", "^searchParams", "^request.json(", "^req.json(", "^request.text(", "^req.text(", "^request.formData(", "^req.formData(", "^formData.get(", "req.get(", "req.header(", "^headers().get(", "^cookies().get(", "ctx.query", "ctx.request.query", "request.query", "ctx.request.body", "request.body", "request.payload", "ctx.params", "request.params", "ctx.headers[", "ctx.cookies.get(", "request.headers[", "ctx.request.header[", "ctx.request.headers[", "ctx.get("]
# Not Koa's ctx.body =: a body whose HTML context is not known (a variable, a
# call's result) is almost always a data object sent as JSON. Koa HTML waits for
# a context option that counts only where the HTML before the value is known.
sinks = ["res.send(", "res.write(", "res.end("]
# a header read by its name: req.get() and req.get(42) read no header
source_args = [{ sources = ["req.get(", "req.header(", "ctx.get("], arg = 1, values = ["*"] },
               { sources = ["request.headers.get("], arg = 1, values = ["*", "!host", "!content-type"] }]
sanitizers = ["escapeHtml(", "escape(", "he.encode(", "he.escape(", "validator.escape(", "_.escape(", "DOMPurify.sanitize(", "sanitizeHtml(", "xss(", "encodeURIComponent("]
fix = "Render with a template engine that escapes by default (res.render), send JSON with res.json(), or escape each value (escape-html, he.encode) before putting it into HTML."
refs = ["CVE-2013-7370"]

[[args]]
context = ["html", "attr"]
# a Server-Sent Events stream (Content-Type text/event-stream set on every path before the write)
# is read by EventSource as text, not rendered as a page
unless_content_type = ["text/event-stream"]

[[samples]]
kind = "vulnerable"
code = '''
app.get("/search", (req, res) => {
  res.send(`<h1>No results for ${req.query.q}</h1>`);
});
'''

[[samples]]
kind = "vulnerable"
code = '''
app.post("/comment", (req, res) => {
  const name = req.body.name;
  res.write('<input name="n" value="' + name + '">');
  res.end();
});
'''

[[samples]]
kind = "safe"
code = '''
app.get("/search", (req, res) => {
  res.send(`<h1>No results for ${escapeHtml(req.query.q)}</h1>`);
});
'''

[[samples]]
kind = "safe"
note = "an object is sent as JSON; a template escapes"
code = '''
app.get("/item", (req, res) => {
  if (req.query.format === "json") return res.send({ id: req.query.id });
  res.render("item", { id: req.query.id });
});
'''

[[samples]]
kind = "safe"
note = "Server-Sent Events: the handler sets text/event-stream, and EventSource reads each line as text"
code = '''
app.get("/events", (req, res) => {
  res.setHeader("Content-Type", "text/event-stream");
  res.write(`event: search\n`);
  res.write(`data: ${JSON.stringify({ q: req.query.q })}\n\n`);
  res.write("data: " + req.query.q + "\n\n");
});
'''

[[samples]]
kind = "vulnerable"
note = "a data: line without a text/event-stream Content-Type is sent as HTML"
code = '''
app.get("/events", (req, res) => {
  res.send("data: " + req.query.q + "\n\n");
});
'''

[[samples]]
kind = "vulnerable"
note = "the stream's Content-Type is set in one branch only; the other sends HTML"
code = '''
app.get("/feed", (req, res) => {
  if (req.query.stream) {
    res.writeHead(200, { "Content-Type": "text/event-stream" });
  }
  res.write("<p>" + req.query.q + "</p>");
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "NestJS: a query value written into HTML"
code = '''
@Controller("search")
export class SearchController {
  @Get()
  page(@Query("q") q: string, @Res() res: Response) {
    res.send("<h1>Results for " + q + "</h1>");
  }
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
@Controller("search")
export class SearchController {
  @Get()
  page(@Query("q") q: string, @Res() res: Response) {
    res.send("<h1>Results for " + escapeHtml(q) + "</h1>");
  }
}
'''

[[samples]]
kind = "safe"
note = "as the fix says: the value is escaped before it goes into the HTML"
code = '''
router.get("/hello", async (ctx) => {
  ctx.response.body = "<h1>Hello " + escapeHtml(String(ctx.query.who)) + "</h1>";
});
'''

[[samples]]
kind = "safe"
note = "Koa: an object body is sent as JSON"
code = '''
router.get("/hello", async (ctx) => {
  ctx.body = { greeting: "Hello " + ctx.query.who };
});
'''

[[samples]]
kind = "vulnerable"
note = "the words data: and event: inside an HTML page do not make it a stream"
code = '''
app.get("/status", (req, res) => {
  res.write(`<p>data: ${req.query.q}</p>`);
  res.end();
});
'''

[[samples]]
kind = "vulnerable"
code = '''
app.get("/back", (req, res) => {
  res.send(`<a href="/">home</a> <p>You came from ${req.headers.referer}</p><p>${req.headers["user-agent"]}</p>`);
});
'''

[[samples]]
kind = "vulnerable"
note = "an event-stream literal in one branch does not make the HTML in the other safe"
code = '''
app.get("/hello", (req, res) => {
  const stream = req.accepts("text/event-stream");
  res.send(stream ? "data: ready\n\n" : "<h1>Hello " + req.query.name + "</h1>");
});
'''

[[samples]]
kind = "safe"
note = "no header name: req.get() reads no header"
code = '''
app.use((req, res) => {
  res.end(req.get());
});
'''

[[samples]]
kind = "vulnerable"
note = "a header read by its name"
code = '''
app.use((req, res) => {
  res.end('<p>From ' + req.get('Referer') + '</p>');
});
'''

[[samples]]
kind = "vulnerable"
note = "the referrer in another framework's spelling (hapi, fastify name the request request)"
code = '''
function back(request, res) {
  res.send(`<p>You came from ${request.headers.referer}</p>`);
}
'''

[[samples]]
kind = "vulnerable"
note = "a header read by its name from a Fetch API request"
code = '''
function hello(request, res) {
  res.send(`<p>${request.headers.get("x-user")}</p>`);
}
'''

[[samples]]
kind = "safe"
note = "Host and Content-Type read by name: a cross-site page cannot set them on the victim's request"
code = '''
function host(request, res) {
  res.send(`<p>${request.headers.get("host")} ${request.headers.get("Content-Type")}</p>`);
}
'''
