id = "js-xss-response"
lang = "js"
class = "xss"
cwe = "CWE-79"
severity = "medium"
tier = "info"
title = "Request value sent back in an HTML response without escaping"
frameworks = ["express", "nestjs", "nextjs", "koa", "fastify", "hapi"]
sources = ["req.query", "req.params", "req.body", "req.cookies", "req.headers", "@Query(", "@Body(", "@Param(", "@Headers(", "^request.nextUrl", "^req.nextUrl", "^searchParams", "^request.json(", "^req.json(", "^request.text(", "^req.text(", "^request.formData(", "^req.formData(", "^formData.get(", "req.get(", "req.header(", "^headers().get(", "^cookies().get(", "ctx.query", "ctx.request.query", "request.query", "ctx.request.body", "request.body", "request.payload", "ctx.params", "request.params", "ctx.headers", "ctx.cookies.get(", "request.headers", "ctx.request.header", "ctx.request.headers", "ctx.get("]
sinks = ["res.send(", "res.write(", "res.end("]
sanitizers = ["escapeHtml(", "escape(", "he.encode(", "he.escape(", "validator.escape(", "_.escape(", "DOMPurify.sanitize(", "sanitizeHtml(", "xss(", "encodeURIComponent("]
fix = "Render with a template engine that escapes by default (res.render), send JSON with res.json(), or escape each value (escape-html, he.encode) before putting it into HTML."
refs = ["CVE-2013-7370"]

[[args]]
context = ["html", "attr"]

[[samples]]
kind = "vulnerable"
code = '''
app.get("/search", (req, res) => {
  res.send(`<h1>No results for ${req.query.q}</h1>`);
});
'''

[[samples]]
kind = "vulnerable"
code = '''
app.post("/comment", (req, res) => {
  const name = req.body.name;
  res.write('<input name="n" value="' + name + '">');
  res.end();
});
'''

[[samples]]
kind = "safe"
code = '''
app.get("/search", (req, res) => {
  res.send(`<h1>No results for ${escapeHtml(req.query.q)}</h1>`);
});
'''

[[samples]]
kind = "safe"
note = "an object is sent as JSON; a template escapes"
code = '''
app.get("/item", (req, res) => {
  if (req.query.format === "json") return res.send({ id: req.query.id });
  res.render("item", { id: req.query.id });
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
note = "NestJS: a query value written into HTML"
code = '''
@Controller("search")
export class SearchController {
  @Get()
  page(@Query("q") q: string, @Res() res: Response) {
    res.send("<h1>Results for " + q + "</h1>");
  }
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
@Controller("search")
export class SearchController {
  @Get()
  page(@Query("q") q: string, @Res() res: Response) {
    res.send("<h1>Results for " + escapeHtml(q) + "</h1>");
  }
}
'''
