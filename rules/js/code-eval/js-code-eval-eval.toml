id = "js-code-eval-eval"
lang = "js"
class = "code-eval"
cwe = "CWE-94"
severity = "critical"
title = "eval, Function constructor or node:vm on request input"
frameworks = ["express", "nestjs", "nextjs", "koa", "fastify", "hapi"]
sources = ["req.query", "req.body", "req.params", "@Query(", "@Body(", "@Param(", "@Req(", "req.originalUrl", "^request.nextUrl", "^req.nextUrl", "^request.url", "^req.url", "^searchParams", "^request.json(", "^req.json(", "^request.text(", "^req.text(", "^request.formData(", "^req.formData(", "^formData.get(", "ctx.query", "ctx.request.query", "request.query", "ctx.request.body", "request.body", "request.payload", "ctx.params", "request.params"]
sinks = ["eval(", "new Function(", "Function(", "vm.runInNewContext(", "vm.runInThisContext(", "vm.Script(", "setTimeout("]
sanitizers = ["Number("]
fix = "Do not evaluate input: parse it as data (JSON.parse, Number) or use a real expression parser; node:vm is not a security boundary."
refs = ["CVE-2021-23344", "CVE-2026-69254", "CVE-2019-10758"]

# setTimeout evaluates only a string first argument; a function there, or input
# in the delay or the arguments passed on, is not code.

[[samples]]
kind = "vulnerable"
code = '''
app.post("/calc", (req, res) => {
  res.json({ result: eval(req.body.expr) });
});
'''

[[samples]]
kind = "vulnerable"
note = "a property path from the request becomes source code"
code = '''
app.post("/settings", (req, res) => {
  const set = new Function("obj", "value", "obj." + req.body.path + " = value;");
  set(settings, req.body.value);
  res.sendStatus(204);
});
'''

[[samples]]
kind = "vulnerable"
note = "vm contexts can reach the host through constructor chains"
code = '''
app.post("/transform", (req, res) => {
  const out = vm.runInNewContext(req.body.code, { input: req.body.data }, { timeout: 100 });
  res.json({ out });
});
'''

[[samples]]
kind = "safe"
code = '''
app.post("/calc", (req, res) => {
  const a = Number(req.body.a), b = Number(req.body.b);
  if (!Number.isFinite(a) || !Number.isFinite(b)) return res.sendStatus(400);
  res.json({ result: a + b });
});
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
code = '''
type CalcDto = { expr: string };

@Controller("calc")
export class CalcController {
  @Post()
  run(@Body() dto: CalcDto): number {
    return eval(dto.expr) as number;
  }
}
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
code = '''
export async function POST(request: Request) {
  const { code } = (await request.json()) as { code: string };
  const fn = new Function("ctx", code);
  return Response.json({ result: fn({}) });
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
@Controller("calc")
export class CalcController {
  @Post()
  run(@Body() dto: { a: string; b: string }): number {
    const a = Number(dto.a), b = Number(dto.b);
    return a + b;
  }
}
'''

[[samples]]
kind = "safe"
dialect = "ts"
code = '''
export async function POST(request: Request) {
  const raw = await request.json();
  const cfg = JSON.parse(JSON.stringify(raw)) as Record<string, unknown>;
  return Response.json({ keys: Object.keys(cfg).length });
}
'''

[[samples]]
kind = "vulnerable"
dialect = "ts"
code = '''
export function GET(req: NextRequest) {
  const expr = req.nextUrl.searchParams.get("expr") ?? "0";
  return Response.json({ value: vm.runInNewContext(expr, {}) as number });
}
'''

[[samples]]
kind = "vulnerable"
note = "REF shape (CVE-2019-10758): an edit form's document text goes to a helper that evaluates it in node:vm to allow extended literals"
code = '''
const vm = require("vm");
function parseRecord(text) {
  const box = { ObjectId, Timestamp };
  vm.runInNewContext("rec = (" + text + ");", box);
  return box.rec;
}
app.post("/coll/:name/update", async (req, res) => {
  const rec = parseRecord(req.body.record);
  await db.collection(req.params.name).replaceOne({ _id: rec._id }, rec);
  res.redirect("back");
});
'''

[[samples]]
kind = "safe"
note = "as the fix says: the text is parsed as data, not evaluated"
code = '''
function parseRecord(text) {
  return JSON.parse(text);
}
app.post("/coll/:name/update", async (req, res) => {
  const rec = parseRecord(req.body.record);
  await db.collection("records").replaceOne({ _id: rec._id }, rec);
  res.redirect("back");
});
'''

[[args]]
sinks = ["setTimeout("]
arg = 1

[[samples]]
kind = "vulnerable"
note = "a string first argument to setTimeout is evaluated"
code = '''
app.get("/later", (req, res) => {
  setTimeout("notify('" + req.query.who + "')", 1000);
  res.sendStatus(202);
});
'''

[[samples]]
kind = "safe"
note = "a function first argument; the delay is not code"
code = '''
app.get("/later", (req, res) => {
  setTimeout(() => res.sendStatus(204), Number(req.query.delay) || 0);
});
'''

[[samples]]
kind = "vulnerable"
note = "JSON.parse gives back the same strings: an expression in them is still evaluated"
code = '''
app.post("/calc", express.text(), (req, res) => {
  const job = JSON.parse(req.body);
  res.json({ result: eval(job.expr) });
});
'''
