# Windows Server build, tests and a live hostenv smoke run (Phase 2). Lives on the
# hostenv-win branch only; main's ci.yml is untouched. Public repo: the runners are free.
name: windows
on:
  push:
    branches: [hostenv-win]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows defaults to autocrlf=true; golden files are compared byte for byte.
      - name: keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          check-latest: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test hostenv, checks, tools and msrc
        env:
          HOSTENV_REQUIRE_SDK: "1" # vtable slots must be checked against the SDK headers, not skipped
        run: |
          # One command per line: under bash -e a failure inside an && list is not fatal.
          go test -v -run 'TestVtableSlotsMatchSDK|TestCollectLeavesHostUnchanged|TestFirewallPolicyLive' ./hostenv/
          go test ./hostenv/ ./checks/ ./internal/msrc/
          go test -v -run 'TestSecureDir|TestSecureDirRefusesSquatted|TestTrustConfig|TestTrustConfigMissingAndLinks|TestSkillsNeedTrustedFolder' .
          # tools: these tests spell Unix paths (/var/www, "dir/site/", PAM, sshd
          # drop-ins, /proc); they are reported to the tools owners, not fixed here.
          go test ./tools/ -skip '^(TestUploadFolder|TestWebRootsSymlinks|TestAppCodeAudit|TestAppCodeAuditKeepsResults|TestServedFallback|TestUnpackagedPAM|TestSSHDropInUnreadable|TestSSHSummary|TestLogPathAllowlist|TestMinerSigns)$'
      - name: fuzz VARIANT / SAFEARRAY decoding
        if: ${{ !cancelled() }}
        run: |
          go test -run '^$' -fuzz '^FuzzDecodeBSTRArray$' -fuzztime 30s ./hostenv/
          go test -run '^$' -fuzz '^FuzzDecodeScalarVariant$' -fuzztime 30s ./hostenv/
      - name: hostfacts smoke (live facts, no panic; prints statuses only)
        if: ${{ !cancelled() }}
        run: |
          go build -o hostfacts.exe ./cmd/hostfacts/
          # Live output stays on the runner: it is unmasked. Only the masked
          # fixture (written by -record, which runs the Masker) and facts
          # replayed from it are uploaded.
          ./hostfacts.exe > "$RUNNER_TEMP/facts.json"
          ./hostfacts.exe -checks > "$RUNNER_TEMP/findings.json"
          ./hostfacts.exe -record fixture > /dev/null
          ./hostfacts.exe -replay fixture > replayed.json
          python - "$RUNNER_TEMP/facts.json" "$RUNNER_TEMP/findings.json" <<'EOF'
          import json, sys
          f = json.load(open(sys.argv[1]))
          ok = True
          def need(cond, what):
              global ok
              if not cond:
                  ok = False
                  print("FAIL:", what)
          need(f["schema"] == "hostfacts/1", "schema")
          need(f["collector"]["name"] == "windows", "collector name")
          need(f["platform"]["status"] == "ok", "platform status")
          need(f["platform"]["value"].get("family") == "windows-server", "platform family")
          need(f["privilege"]["value"]["elevated"], "runner elevated")
          # Status and reason only: detail and values can hold paths and names.
          for k in ["packages", "patches", "services", "processes", "accounts", "listeners",
                    "persistence", "firewall", "antimalware", "auth_events", "web"]:
              o = f[k]
              print(f"{k:12} {o['status']:8} {o.get('reason', '')}")
              need(o["status"] in ("ok", "partial"), k)
          for k, o in f["remote_access"].items():
              print(f"{k:12} {o['status']:8} {o.get('reason', '')}")
              need(o["status"] in ("ok", "partial", "not_applicable"), k)
          r = json.load(open("replayed.json"))
          for k in ["platform", "packages", "patches", "services", "accounts", "listeners", "persistence", "firewall", "web"]:
              need(r[k]["status"] == f[k]["status"], "replay status of " + k)
          print("findings:", len(json.load(open(sys.argv[2]))))
          sys.exit(0 if ok else 1)
          EOF
      - name: shentu survey and patrol smoke (counts only)
        if: ${{ !cancelled() }}
        run: |
          go build -o shentu.exe .
          # Creates %ProgramData%\Shentu with its protected ACL, reads the
          # (empty) config, surveys this runner. The profile names processes
          # and accounts: it stays in RUNNER_TEMP, only counts are printed.
          ./shentu.exe survey > "$RUNNER_TEMP/survey.json"
          python - "$RUNNER_TEMP/survey.json" <<'EOF'
          import json, sys, collections
          p = json.load(open(sys.argv[1]))
          ok = p["os"].startswith("Windows Server") and p["firewall"].startswith("Windows Firewall") and p["cron_files"] and p["services"]
          print("services", len(p["services"]), "autostart", len(p["cron_files"]), "accounts", len(p["login_accounts"] or []))
          print("risks", dict(collections.Counter(r["severity"] for r in p.get("risks") or [])))
          sys.exit(0 if ok else 1)
          EOF
          # No model runs here, so patrol may stop at the LLM step; its exit
          # code is reported, not judged. The report itself is not printed.
          set +e
          ./shentu.exe patrol --dry-run > "$RUNNER_TEMP/patrol.txt" 2>&1
          echo "patrol --dry-run exit $?, $(wc -l < "$RUNNER_TEMP/patrol.txt") lines"
      - name: keep the masked fixture for review (not committed automatically)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostfacts-fixture-${{ matrix.os }}
          path: |
            fixture/
            replayed.json
          retention-days: 1
