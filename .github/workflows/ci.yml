# Tests, security invariants and a vulnerability scan on every push and pull request,
# and once a week, so a new advisory for Go or a dependency shows up without a code change.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest stable Go, so releases get standard library security fixes; go.mod's
          # toolchain line is the floor. (go-version-file would install the old `go` line.)
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
