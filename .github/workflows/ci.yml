# Tests, security invariants and a vulnerability scan on every push and pull request,
# and once a week, so a new advisory for Go or a dependency shows up without a code change.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Latest stable Go, so releases get standard library security fixes; go.mod's
          # toolchain line is the floor. (go-version-file would install the old `go` line.)
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      # Summary runs the engine skips as unneeded are made anyway and must agree
      # (rules/engine/interproc.go, checkSkips): samples, held-out cases, projects.
      - run: go test -count=1 ./rules/... -run 'TestSamples|TestRouteSamples|TestHeldOut|TestProject|TestMayReturnInput|TestParamsRead'
        env:
          SHENTU_CHECK_SKIPS: "1"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  # macOS: the whole suite on a GitHub-hosted Mac (arm64), without sudo. Most darwin
  # collector tests replay fixtures; this also builds and runs them on macOS itself.
  # No macOS release binary is built yet.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
