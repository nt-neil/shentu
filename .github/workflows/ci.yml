# Tests, security invariants and a vulnerability scan on every push and pull request,
# and once a week, so a new advisory for Go or a dependency shows up without a code change.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Latest stable Go, so releases get standard library security fixes; go.mod's
          # toolchain line is the floor. (go-version-file would install the old `go` line.)
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
