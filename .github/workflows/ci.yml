# Tests, security invariants and a vulnerability scan on every push and pull request,
# and once a week, so a new advisory for Go or a dependency shows up without a code change.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Latest stable Go, so releases get standard library security fixes; go.mod's
          # toolchain line is the floor. (go-version-file would install the old `go` line.)
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # The offline signature extractor is its own module (its YAML
      # dependency stays out of shentu): tested apart.
      - run: go vet ./... && go test ./...
        working-directory: tools/sigextract
      # Its YAML dependency is scanned too: the module is not in ./... above.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: tools/sigextract
  # Attack detection measured on Nuclei's http templates (downloaded at the
  # commit in tools/detecteval/fetch.go, hash checked) and on ordinary
  # requests: a change in false positives, conversion counts or the graded
  # results fails; templates that could not be downloaded or whose hash
  # differs are NOT RUN, and fail too (never a pass).
  detect-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/detecteval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./... && go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: evaluate
        run: |
          set +e
          go run . > "$RUNNER_TEMP/eval.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/eval.txt"
          { echo '## detect-eval'; echo '```'; cat "$RUNNER_TEMP/eval.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 3 ]; then
            echo "::error title=detect-eval NOT RUN::$(grep -m1 'NOT RUN' "$RUNNER_TEMP/eval.txt")"
          elif [ "$rc" -ne 0 ]; then
            echo "::error title=detect-eval::results differ from tools/detecteval/baseline.json (exit $rc)"
          fi
          exit "$rc"
  # macOS: the whole suite on a GitHub-hosted Mac (arm64), without sudo. Most darwin
  # collector tests replay fixtures; this also builds and runs them on macOS itself.
  # No macOS release binary is built yet.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
