# Runs only when a version tag (v*) is pushed: builds the release with GoReleaser and
# attaches signed build provenance, so anyone can check that a file came from this repo:
#   gh attestation verify shentu_linux_amd64.tar.gz --repo nt-neil/shentu
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Latest stable Go, so releases get standard library security fixes; go.mod's
          # toolchain line is the floor. (go-version-file would install the old `go` line.)
          go-version: stable
          check-latest: true
      - run: go vet ./... && go test ./...
      # A release with a known, reachable vulnerability in Shentu or the Go standard library is not built.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
